<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>无限草地 - 拾荒物品栏版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #3b7a3b; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none; 
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ================= 核心配置区 =================
        const bgTargetSize = 128;       
        const playerTargetSize = 48;    
        
        const itemTargetSize = 100;     
        const cellSize = 300;           
        const spawnChance = 0.1;        

        const maxSpeed = 5.5;          
        const maxRadius = 250;         
        const accelerationSmooth = 0.15; 
        const friction = 0.94;           
        
        // UI 配置
        const uiItemSize = 64;          // 底部图标大小
        const uiGap = 15;               // 物品间距
        // ==========================================

        // 收集数据
        const collectedGrassSet = new Set();
        const collectedPebbleSet = new Set();
        
        const inventory = {
            grass: 0,
            pebble: 0
        };

        // 资源加载
        const bgImg = new Image();
        const playerImg = new Image();
        const grassImg = new Image();
        const pebbleImg = new Image();
        
        bgImg.src = './Game/picture/item/grass_land.png';
        playerImg.src = './Game/picture/mob/player.png';
        grassImg.src = './Game/picture/item/grass.png';
        pebbleImg.src = './Game/picture/item/pebble.png';

        // 预加载数字图片
        const digitImgs = {};
        for (let i = 0; i <= 9; i++) {
            digitImgs[i] = new Image();
            digitImgs[i].src = `./Game/picture/text/${i}.png`;
        }

        let bgW = bgTargetSize, bgH = bgTargetSize;
        let playerW = playerTargetSize, playerH = playerTargetSize;
        let grassW = itemTargetSize, grassH = itemTargetSize;
        let pebbleW = itemTargetSize, pebbleH = itemTargetSize;

        let imagesLoaded = 0;
        function checkLoaded() {
            imagesLoaded++;
            if (imagesLoaded >= 4) {
                if (bgImg.complete && bgImg.naturalHeight !== 0) {
                    bgW = bgTargetSize;
                    bgH = bgTargetSize * (bgImg.height / bgImg.width);
                }
                if (playerImg.complete && playerImg.naturalHeight !== 0) {
                    playerW = playerTargetSize;
                    playerH = playerTargetSize * (playerImg.height / playerImg.width);
                }
                if (grassImg.complete && grassImg.naturalHeight !== 0) {
                    grassW = itemTargetSize;
                    grassH = itemTargetSize * (grassImg.height / grassImg.width);
                }
                if (pebbleImg.complete && pebbleImg.naturalHeight !== 0) {
                    pebbleW = itemTargetSize;
                    pebbleH = itemTargetSize * (pebbleImg.height / pebbleImg.width);
                }
                gameLoop();
            }
        }
        
        bgImg.onload = checkLoaded;
        playerImg.onload = checkLoaded;
        grassImg.onload = checkLoaded;
        pebbleImg.onload = checkLoaded;
        bgImg.onerror = checkLoaded;
        playerImg.onerror = checkLoaded;
        grassImg.onerror = checkLoaded;
        pebbleImg.onerror = checkLoaded;

        let playerX = 0;
        let playerY = 0;
        let velocityX = 0;
        let velocityY = 0;

        let logicWidth = window.innerWidth;
        let logicHeight = window.innerHeight;

        let isMouseDown = false;
        let mouseX = 0;
        let mouseY = 0;

        function hash(x, y, seed = 0) {
            let n = x * 374761393 + y * 668265263 + seed * 144665;
            n = (n ^ (n >> 13)) * 1274126177;
            return ((n ^ (n >> 16)) >>> 0) / 4294967296;
        }

        function tryCollect(screenX, screenY) {
            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);
            
            const clickWorldX = screenX + camX;
            const clickWorldY = screenY + camY;

            const startCellX = Math.floor((camX - itemTargetSize) / cellSize) - 1;
            const endCellX = Math.floor((camX + logicWidth + itemTargetSize) / cellSize) + 1;
            const startCellY = Math.floor((camY - itemTargetSize) / cellSize) - 1;
            const endCellY = Math.floor((camY + logicHeight + itemTargetSize) / cellSize) + 1;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    
                    if (hash(cx, cy, 1) < spawnChance) {
                        const offsetX = hash(cx, cy, 2) * cellSize;
                        const offsetY = hash(cx, cy, 3) * cellSize;
                        const worldX = cx * cellSize + offsetX;
                        const worldY = cy * cellSize + offsetY;
                        const key = `${Math.floor(worldX)},${Math.floor(worldY)}`;

                        if (!collectedGrassSet.has(key)) {
                            const hitW = grassW + 5;
                            const hitH = grassH + 5;
                            if (clickWorldX > worldX - hitW / 2 && clickWorldX < worldX + hitW / 2 &&
                                clickWorldY > worldY - hitH / 2 && clickWorldY < worldY + hitH / 2) {
                                
                                collectedGrassSet.add(key);
                                inventory.grass++;
                                return true; 
                            }
                        }
                    }

                    if (hash(cx, cy, 4) < spawnChance) {
                        const offsetX = hash(cx, cy, 5) * cellSize;
                        const offsetY = hash(cx, cy, 6) * cellSize;
                        const worldX = cx * cellSize + offsetX;
                        const worldY = cy * cellSize + offsetY;
                        const key = `${Math.floor(worldX)},${Math.floor(worldY)}`;

                        if (!collectedPebbleSet.has(key)) {
                            const hitW = pebbleW + 5;
                            const hitH = pebbleH + 5;
                            if (clickWorldX > worldX - hitW / 2 && clickWorldX < worldX + hitW / 2 &&
                                clickWorldY > worldY - hitH / 2 && clickWorldY < worldY + hitH / 2) {
                                
                                collectedPebbleSet.add(key);
                                inventory.pebble++;
                                return true; 
                            }
                        }
                    }
                }
            }
            return false;
        }

        canvas.addEventListener('mousedown', (e) => { 
            if (e.button === 0) {
                if (tryCollect(e.clientX, e.clientY)) return;
                isMouseDown = true; 
                mouseX = e.clientX; 
                mouseY = e.clientY; 
            }
        });
        
        window.addEventListener('mousemove', (e) => { 
            if (isMouseDown) { 
                mouseX = e.clientX; 
                mouseY = e.clientY; 
            } 
        });
        
        window.addEventListener('mouseup', (e) => { 
            if (e.button === 0) isMouseDown = false; 
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                if (tryCollect(touch.clientX, touch.clientY)) return;
                isMouseDown = true;
                mouseX = touch.clientX;
                mouseY = touch.clientY;
            }
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isMouseDown && e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            isMouseDown = false; 
        }, { passive: false });
        
        window.addEventListener('touchcancel', () => { isMouseDown = false; });

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            logicWidth = window.innerWidth;
            logicHeight = window.innerHeight;

            canvas.width = logicWidth * dpr;
            canvas.height = logicHeight * dpr;
            canvas.style.width = logicWidth + 'px';
            canvas.style.height = logicHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function update() {
            if (isMouseDown) {
                const centerX = logicWidth / 2;
                const centerY = logicHeight / 2;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                let targetVx = 0;
                let targetVy = 0;

                if (distance > 10) { 
                    const effectiveDist = Math.min(distance, maxRadius);
                    const currentMaxSpeed = (effectiveDist / maxRadius) * maxSpeed;
                    targetVx = (dx / distance) * currentMaxSpeed;
                    targetVy = (dy / distance) * currentMaxSpeed;
                }

                velocityX += (targetVx - velocityX) * accelerationSmooth;
                velocityY += (targetVy - velocityY) * accelerationSmooth;
            } else {
                velocityX *= friction;
                velocityY *= friction;
                if (Math.abs(velocityX) < 0.05) velocityX = 0;
                if (Math.abs(velocityY) < 0.05) velocityY = 0;
            }

            playerX += velocityX;
            playerY += velocityY;
        }

        function draw() {
            ctx.imageSmoothingEnabled = false;
            
            if (!bgImg.complete || bgImg.naturalHeight === 0) {
                ctx.fillStyle = '#3b7a3b'; 
                ctx.fillRect(0, 0, logicWidth, logicHeight);
            } else {
                ctx.clearRect(0, 0, logicWidth, logicHeight);
            }

            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);

            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                const startX = Math.floor(camX / bgW) * bgW;
                const startY = Math.floor(camY / bgH) * bgH;
                const endX = camX + logicWidth;
                const endY = camY + logicHeight;

                for (let x = startX; x <= endX; x += bgW) {
                    for (let y = startY; y <= endY; y += bgH) {
                        ctx.drawImage(bgImg, x - camX, y - camY, bgW, bgH);
                    }
                }
            }

            const startCellX = Math.floor(camX / cellSize) - 1;
            const endCellX = Math.floor((camX + logicWidth) / cellSize) + 1;
            const startCellY = Math.floor(camY / cellSize) - 1;
            const endCellY = Math.floor((camY + logicHeight) / cellSize) + 1;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    
                    if (grassImg.complete && grassImg.naturalHeight !== 0 && hash(cx, cy, 1) < spawnChance) {
                        const offsetX = hash(cx, cy, 2) * cellSize;
                        const offsetY = hash(cx, cy, 3) * cellSize;
                        const worldX = cx * cellSize + offsetX;
                        const worldY = cy * cellSize + offsetY;
                        const key = `${Math.floor(worldX)},${Math.floor(worldY)}`;
                        if (!collectedGrassSet.has(key)) {
                            ctx.drawImage(grassImg, (worldX - camX) - grassW / 2, (worldY - camY) - grassH / 2, grassW, grassH);
                        }
                    }

                    if (pebbleImg.complete && pebbleImg.naturalHeight !== 0 && hash(cx, cy, 4) < spawnChance) {
                        const offsetX = hash(cx, cy, 5) * cellSize;
                        const offsetY = hash(cx, cy, 6) * cellSize;
                        const worldX = cx * cellSize + offsetX;
                        const worldY = cy * cellSize + offsetY;
                        const key = `${Math.floor(worldX)},${Math.floor(worldY)}`;
                        if (!collectedPebbleSet.has(key)) {
                            ctx.drawImage(pebbleImg, (worldX - camX) - pebbleW / 2, (worldY - camY) - pebbleH / 2, pebbleW, pebbleH);
                        }
                    }
                }
            }

            if (playerImg.complete && playerImg.naturalHeight !== 0) {
                const playerScreenX = Math.round(logicWidth / 2 - playerW / 2);
                const playerScreenY = Math.round(logicHeight / 2 - playerH / 2);
                ctx.drawImage(playerImg, playerScreenX, playerScreenY, playerW, playerH);
            }

            drawInventoryUI();
        }

        function drawInventoryUI() {
            const activeItems = [];
            if (inventory.grass > 0) activeItems.push({ type: 'grass', img: grassImg, count: inventory.grass });
            if (inventory.pebble > 0) activeItems.push({ type: 'pebble', img: pebbleImg, count: inventory.pebble });

            if (activeItems.length === 0) return;

            const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
            let startX = (logicWidth - totalWidth) / 2;
            const startY = logicHeight - uiItemSize - 20;

            for (let i = 0; i < activeItems.length; i++) {
                const item = activeItems[i];
                const itemX = startX + i * (uiItemSize + uiGap);
                const itemY = startY;

                if (item.img.complete && item.img.naturalHeight !== 0) {
                    ctx.drawImage(item.img, itemX, itemY, uiItemSize, uiItemSize);
                }

                // 🌟 修改点：把数字的 Y 轴从 -10 抬高到 -2，X 轴向右微调，紧紧贴住右上角
                drawNumber(item.count, itemX + uiItemSize - 5, itemY - 2);
            }
        }

        function drawNumber(num, endX, endY) {
            const str = num.toString();
            let currentRightX = endX;
            const numScale = 2.0; 

            for (let i = str.length - 1; i >= 0; i--) {
                const digit = str[i];
                const img = digitImgs[digit];

                if (img && img.complete && img.naturalHeight !== 0) {
                    const w = img.width * numScale;
                    const h = img.height * numScale;
                    
                    ctx.drawImage(img, currentRightX - w, endY, w, h);

                    // 🌟 修改点：多位数间距改为 w + 3，给数字留一点点白边
                    currentRightX -= (w + 3); 
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 24px "Courier New", Courier, monospace';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    ctx.fillText(str, endX, endY);
                    return; 
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
