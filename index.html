<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>无限草地 - 探索收集版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none; 
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        /* 左上角的 UI 界面 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none; /* 防止遮挡鼠标点击 */
        }
    </style>
</head>
<body>

    <!-- UI 层 -->
    <div id="ui-layer">🌿 收集的草: <span id="grass-count">0</span></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ================= 核心手感配置区 =================
        const grassLandTargetSize = 128; // 背景草地大小
        const playerTargetSize = 48;     // 人物大小
        const grassItemTargetSize = 32;  // 收集物草的大小
        
        const maxSpeed = 5.5;          
        const maxRadius = 250;         
        
        const accelerationSmooth = 0.15; 
        const friction = 0.94;           
        // ==================================================

        // ================= 物品生成配置区 =================
        const chunkSize = 256;       // 每个区块的大小（像素）
        const grassPerChunk = 8;     // 每个区块生成多少株草（密度）
        const collectRadius = 50;    // 自动收集半径（人物走到多近会被收集）
        
        const collectedGrassSet = new Set(); // 记录已经拔掉的草的世界坐标
        let grassCount = 0;                  // 收集计数
        // ==================================================

        // 加载图片
        const bgImg = new Image();
        const playerImg = new Image();
        const grassItemImg = new Image();
        
        bgImg.src = './Game/picture/item/grass_land.png';
        playerImg.src = './Game/picture/mob/player.png';
        grassItemImg.src = './Game/picture/item/grass.png';

        let bgW = grassLandTargetSize, bgH = grassLandTargetSize;
        let playerW = playerTargetSize, playerH = playerTargetSize;
        let itemW = grassItemTargetSize, itemH = grassItemTargetSize;

        let imagesLoaded = 0;
        function checkLoaded() {
            imagesLoaded++;
            // 确保图片加载完毕（或者出错）后开始游戏
            if (imagesLoaded >= 3) {
                if (bgImg.complete && bgImg.naturalHeight !== 0) {
                    bgW = grassLandTargetSize;
                    bgH = grassLandTargetSize * (bgImg.height / bgImg.width);
                }
                if (playerImg.complete && playerImg.naturalHeight !== 0) {
                    playerW = playerTargetSize;
                    playerH = playerTargetSize * (playerImg.height / playerImg.width);
                }
                if (grassItemImg.complete && grassItemImg.naturalHeight !== 0) {
                    itemW = grassItemTargetSize;
                    itemH = grassItemTargetSize * (grassItemImg.height / grassItemImg.width);
                }
                gameLoop();
            }
        }
        
        bgImg.onload = checkLoaded;
        playerImg.onload = checkLoaded;
        grassItemImg.onload = checkLoaded;
        bgImg.onerror = checkLoaded;
        playerImg.onerror = checkLoaded;
        grassItemImg.onerror = checkLoaded;

        let playerX = 0;
        let playerY = 0;
        let velocityX = 0;
        let velocityY = 0;

        let logicWidth = window.innerWidth;
        let logicHeight = window.innerHeight;

        let isMouseDown = false;
        let mouseX = 0;
        let mouseY = 0;

        // --- 鼠标与触摸事件统一 ---
        function startMove(x, y) { isMouseDown = true; mouseX = x; mouseY = y; }
        function moveTo(x, y) { mouseX = x; mouseY = y; }
        function endMove() { isMouseDown = false; }

        canvas.addEventListener('mousedown', (e) => { if (e.button === 0) startMove(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (isMouseDown) moveTo(e.clientX, e.clientY); });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) endMove(); });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) startMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isMouseDown && e.touches.length > 0) moveTo(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchend', (e) => { e.preventDefault(); endMove(); }, { passive: false });
        window.addEventListener('touchcancel', endMove);
        // ------------------------------------------

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            logicWidth = window.innerWidth;
            logicHeight = window.innerHeight;

            canvas.width = logicWidth * dpr;
            canvas.height = logicHeight * dpr;
            canvas.style.width = logicWidth + 'px';
            canvas.style.height = logicHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function update() {
            // 移动逻辑
            if (isMouseDown) {
                const centerX = logicWidth / 2;
                const centerY = logicHeight / 2;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                let targetVx = 0;
                let targetVy = 0;

                if (distance > 10) { 
                    const effectiveDist = Math.min(distance, maxRadius);
                    const currentMaxSpeed = (effectiveDist / maxRadius) * maxSpeed;
                    targetVx = (dx / distance) * currentMaxSpeed;
                    targetVy = (dy / distance) * currentMaxSpeed;
                }

                velocityX += (targetVx - velocityX) * accelerationSmooth;
                velocityY += (targetVy - velocityY) * accelerationSmooth;
            } else {
                velocityX *= friction;
                velocityY *= friction;
                if (Math.abs(velocityX) < 0.05) velocityX = 0;
                if (Math.abs(velocityY) < 0.05) velocityY = 0;
            }

            playerX += velocityX;
            playerY += velocityY;
        }

        // 🌟 核心算法：基于坐标的伪随机数生成器 (保证无论何时回到该区块，生成的草位置都一致)
        function pseudoRandom(x, y, seed) {
            let n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
            return n - Math.floor(n);
        }

        function draw() {
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, logicWidth, logicHeight);

            // 强制取整相机坐标，防止背景和物品错位抖动
            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);

            // 1. 绘制底层背景
            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                const startX = Math.floor(camX / bgW) * bgW;
                const startY = Math.floor(camY / bgH) * bgH;
                const endX = camX + logicWidth;
                const endY = camY + logicHeight;

                for (let x = startX; x <= endX; x += bgW) {
                    for (let y = startY; y <= endY; y += bgH) {
                        ctx.drawImage(bgImg, x - camX, y - camY, bgW, bgH);
                    }
                }
            }

            // 2. 生成并绘制草地上的草
            drawAndCollectGrass(camX, camY);

            // 3. 绘制居中人物
            if (playerImg.complete && playerImg.naturalHeight !== 0) {
                const playerScreenX = Math.round(logicWidth / 2 - playerW / 2);
                const playerScreenY = Math.round(logicHeight / 2 - playerH / 2);
                ctx.drawImage(playerImg, playerScreenX, playerScreenY, playerW, playerH);
            }
        }

        function drawAndCollectGrass(camX, camY) {
            if (!grassItemImg.complete || grassItemImg.naturalHeight === 0) return;

            // 计算当前屏幕覆盖了哪些区块（Chunk）
            const startChunkX = Math.floor(camX / chunkSize) - 1;
            const endChunkX = Math.floor((camX + logicWidth) / chunkSize) + 1;
            const startChunkY = Math.floor(camY / chunkSize) - 1;
            const endChunkY = Math.floor((camY + logicHeight) / chunkSize) + 1;

            // 遍历可见的区块
            for (let cx = startChunkX; cx <= endChunkX; cx++) {
                for (let cy = startChunkY; cy <= endChunkY; cy++) {
                    
                    // 在每个区块内生成固定数量的草
                    for (let i = 0; i < grassPerChunk; i++) {
                        // 使用区块坐标和当前草的序号作为种子，生成固定的随机位置
                        const randX = pseudoRandom(cx, cy, i * 2 + 1);
                        const randY = pseudoRandom(cx, cy, i * 2 + 2);

                        // 计算草在世界中的绝对坐标
                        const worldX = cx * chunkSize + randX * chunkSize;
                        const worldY = cy * chunkSize + randY * chunkSize;

                        // 生成唯一标识 Key
                        const key = `${Math.floor(worldX)},${Math.floor(worldY)}`;
                        
                        // 如果这株草已经被拔掉了，就不画了
                        if (collectedGrassSet.has(key)) continue;

                        // 计算屏幕坐标
                        const screenX = worldX - camX;
                        const screenY = worldY - camY;

                        // 绘制草
                        ctx.drawImage(grassItemImg, screenX - itemW / 2, screenY - itemH / 2, itemW, itemH);

                        // 碰撞检测：如果人物离草很近，自动收集
                        const distToPlayer = Math.hypot(worldX - playerX, worldY - playerY);
                        if (distToPlayer < collectRadius) {
                            collectedGrassSet.add(key); // 标记为已收集
                            grassCount++; // 计数增加
                            // 更新 UI
                            document.getElementById('grass-count').innerText = grassCount;
                        }
                    }
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
