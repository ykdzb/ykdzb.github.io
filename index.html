<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha 1.0 - 合成版</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #3b7a3b; user-select: none;
            -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block; image-rendering: pixelated; image-rendering: crisp-edges;
            touch-action: none; cursor: default; position: absolute; top: 0; left: 0; outline: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" tabindex="0"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ======================= 一、核心配置区 =======================
        const bgTargetSize = 80, playerTargetSize = 48, itemTargetSize = 64;
        const grassChance = 0.025, pebbleChance = 0.025;
        const treeChance = pebbleChance / 10;
        const leafSizeMultiplier = 1.4;

        const maxSpeed = 5.5, maxRadius = 250, accelerationSmooth = 0.15, friction = 0.94;
        
        // UI 基础配置 (会被 UI_SCALE 动态缩放)
        let uiItemSize = 38, uiGap = 9, uiBottomMargin = 12, placeBtnSize = 38, placeBtnMargin = 18;
        let joystickBaseSize = 102, joystickBaseMargin = 30, joystickControlSize = 51;
        let UI_SCALE = 1.0;

        const electorSlideSpeed = 0.2;
        
        // 合成 UI 配置 (固定不缩放)
        const craftSize = 102, craftMargin = 30;
        const craftSlotSize = 40; 

        const FIXED_DT = 1000 / 60;
        const MAX_FRAME_TIME = 200;
        const TREE_CACHE_LIMIT = 20000;

        // ======================= 二、游戏状态变量 =======================
        const collectedGrassSet = new Set(), collectedPebbleSet = new Set(), collectedBranchSet = new Set();
        const placedItems = new Map();
        
        // 扩充库存
        const inventory = { grass: 0, pebble: 0, hay: 0, rope: 0, gravel: 0, branch: 0 };
        let hotbarOrder = [];
        
        let selectedItemIndex = 0, isPlaceButtonPressed = false, electorVisualX = null;
        let isTouchMode = true, joystickActive = false, joystickTouchId = null;
        let joystickCurrentX = 0, joystickCurrentY = 0;

        // 合成系统状态
        let craftSlots = [null, null, null, null]; 
        let craftState = 'idle'; // idle, shaking, crafting, result, collecting
        let craftResult = null;  
        let craftAnimTimer = 0;
        let craftShakeOffset = { x: 0, y: 0 };
        let lastEdgeClickTime = 0;
        let returningItems = [];

        // 不可放置的物品黑名单
        const unplaceableItems = ['hay', 'rope', 'gravel'];

        // ======================= 三、加载图片 =======================
        const bgImg = new Image(), playerImg = new Image(), playerRightImg = new Image();
        const playerLeftImg = new Image(), playerUpImg = new Image(), playerDownImg = new Image();
        const grassImg = new Image(), pebbleImg = new Image(), electorImg = new Image();
        const placeImg = new Image(), pressedPlaceImg = new Image();
        const joystickBaseImg = new Image(), joystickControlImg = new Image();
        const treeStumpImg = new Image(), treeTrunkImg = new Image(), leafImg = new Image();
        const craftImg = new Image(), hayImg = new Image(), ropeImg = new Image(), gravelImg = new Image(), branchImg = new Image();

        bgImg.src = './Game/picture/item/grass_land.png';
        playerImg.src = './Game/picture/mob/player.png';
        playerRightImg.src = './Game/picture/mob/player_right.png';
        playerLeftImg.src = './Game/picture/mob/player_left.png';
        playerUpImg.src = './Game/picture/mob/player_up.png';
        playerDownImg.src = './Game/picture/mob/player_down.png';
        grassImg.src = './Game/picture/item/grass.png';
        pebbleImg.src = './Game/picture/item/pebble.png';
        treeStumpImg.src = './Game/picture/item/tree_stump.png';
        treeTrunkImg.src = './Game/picture/item/tree_trunk.png';
        leafImg.src = './Game/picture/item/leaf.png';
        electorImg.src = './Game/picture/ui/hotbar_elector.png';
        placeImg.src = './Game/picture/ui/place.png';
        pressedPlaceImg.src = './Game/picture/ui/pressed_place.png';
        joystickBaseImg.src = './Game/picture/ui/joystick.png';
        joystickControlImg.src = './Game/picture/ui/control_stick.png';
        
        craftImg.src = './Game/picture/ui/craft.png';
        hayImg.src = './Game/picture/item/hay.png'; 
        ropeImg.src = './Game/picture/item/rope.png';
        gravelImg.src = './Game/picture/item/gravel.png';
        branchImg.src = './Game/picture/item/branch.png'; // 新增树枝

        const digitImgs = {};
        for (let i = 0; i <= 9; i++) {
            digitImgs[i] = new Image();
            digitImgs[i].src = `./Game/picture/text/${i}.png`;
        }

        let bgW = bgTargetSize, bgH = bgTargetSize, playerW = playerTargetSize, playerH = playerTargetSize;
        let logicWidth = window.innerWidth, logicHeight = window.innerHeight;
        let isPortraitForced = false, isGameStarted = false;
        let playerX = 0, playerY = 0, velocityX = 0, velocityY = 0;
        let errors = [];

        // ======================= 四、键盘事件 =======================
        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowleft: false, arrowdown: false, arrowright: false };
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
                if (key.startsWith('arrow')) e.preventDefault();
                isTouchMode = false;
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        // ======================= 五、图片加载 =======================
        const allImages = [
            bgImg, playerImg, playerRightImg, playerLeftImg, playerUpImg, playerDownImg,
            grassImg, pebbleImg, treeStumpImg, treeTrunkImg, leafImg,
            electorImg, placeImg, pressedPlaceImg, joystickBaseImg, joystickControlImg,
            craftImg, hayImg, ropeImg, gravelImg, branchImg // 加入树枝
        ];
        for (let i = 0; i <= 9; i++) allImages.push(digitImgs[i]);

        let imagesLoaded = 0;
        const totalImages = allImages.length;

        function checkLoaded() { imagesLoaded++; if (imagesLoaded >= totalImages) startGame(); }
        function trackImage(img) {
            let counted = false;
            const done = (failed) => {
                if (counted) return;
                counted = true;
                if (failed) errors.push(img.src.split('/').pop());
                checkLoaded();
            };
            img.onload = () => done(false);
            img.onerror = () => done(true);
            if (img.complete) done(img.naturalHeight === 0);
        }
        allImages.forEach(trackImage);
        setTimeout(startGame, 3000);

        function startGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            if (bgImg.complete && bgImg.naturalHeight !== 0) { bgW = bgTargetSize; bgH = bgTargetSize * (bgImg.height / bgImg.width); }
            if (playerImg.complete && playerImg.naturalHeight !== 0) { playerW = playerTargetSize; playerH = playerTargetSize * (playerImg.height / playerImg.width); }
            initScreen();
            lastFrameTime = performance.now();
            accumulator = 0;
            requestAnimationFrame(gameLoop);
        }

        initScreen();

        // ======================= 六、屏幕适配 =======================
        function initScreen() {
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth, h = window.innerHeight;
            
            if (h > w) {
                isPortraitForced = true; logicWidth = h; logicHeight = w;
                canvas.width = logicWidth * dpr; canvas.height = logicHeight * dpr;
                canvas.style.width = logicWidth + "px"; canvas.style.height = logicHeight + "px";
                canvas.style.transformOrigin = "top left";
                canvas.style.transform = `translateX(${w}px) rotate(90deg)`;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            } else {
                isPortraitForced = false; logicWidth = w; logicHeight = h;
                canvas.width = logicWidth * dpr; canvas.height = logicHeight * dpr;
                canvas.style.width = logicWidth + "px"; canvas.style.height = logicHeight + "px";
                canvas.style.transform = "none";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            if (logicWidth > logicHeight) {
                UI_SCALE = 1.25;
            } else {
                UI_SCALE = 1.0;
            }

            // 检测手机端，UI 缩小一点
            const isMobilePhone = /Android.*Mobile|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobilePhone) {
                UI_SCALE *= 0.85; // 缩小 15%
            }

            // 重新应用尺寸
            uiItemSize = 38 * UI_SCALE;
            uiGap = 9 * UI_SCALE;
            uiBottomMargin = 12 * UI_SCALE;
            placeBtnSize = 38 * UI_SCALE;
            placeBtnMargin = 18 * UI_SCALE;
            joystickBaseSize = 102 * UI_SCALE;
            joystickBaseMargin = 30 * UI_SCALE;
            joystickControlSize = 51 * UI_SCALE;

            joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
            joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
            electorVisualX = null;
        }

        let resizeTimer = null;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(initScreen, 120); });
        window.addEventListener('orientationchange', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(initScreen, 200); });

        function getLogicCoords(clientX, clientY) {
            if (isPortraitForced) return { x: clientY, y: window.innerWidth - clientX };
            return { x: clientX, y: clientY };
        }

        // ======================= 七、世界生成 =======================
        function hash(x, y, seed = 0) {
            let n = x * 374761393 + y * 668265263 + seed * 144665;
            n = (n ^ (n >> 13)) * 1274126177;
            return ((n ^ (n >> 16)) >>> 0) / 4294967296;
        }

        function computeIsTreeCenter(cx, cy) {
            const myH = hash(cx, cy, 99);
            if (myH >= treeChance) return false;
            for (let dx = -4; dx <= 4; dx++) {
                for (let dy = -4; dy <= 4; dy++) {
                    if (dx === 0 && dy === 0) continue;
                    const otherH = hash(cx + dx, cy + dy, 99);
                    if (otherH < treeChance) {
                        if (otherH < myH || (otherH === myH && (cx + dx < cx || (cx + dx === cx && cy + dy < cy)))) return false;
                    }
                }
            }
            return true;
        }

        const treeInfoCache = new Map();
        function getTreeInfo(cx, cy) {
            const key = cx + ',' + cy;
            let info = treeInfoCache.get(key);
            if (info) return info;
            const isCenter = computeIsTreeCenter(cx, cy);
            const trunkHeight = isCenter ? Math.floor(hash(cx, cy, 100) * 3) + 3 : 0;
            info = { isCenter, trunkHeight };
            treeInfoCache.set(key, info);
            if (treeInfoCache.size > TREE_CACHE_LIMIT) {
                let i = 0; const del = Math.floor(TREE_CACHE_LIMIT / 4);
                for (const k of treeInfoCache.keys()) { treeInfoCache.delete(k); if (++i >= del) break; }
            }
            return info;
        }
        function isTreeCenter(cx, cy) { return getTreeInfo(cx, cy).isCenter; }

        const occupiedCache = new Map();
        function isTreeOccupied(cx, cy) {
            const key = cx + ',' + cy;
            const cached = occupiedCache.get(key);
            if (cached !== undefined) return cached;
            let occupied = false;
            for (let dy = 0; dy <= 8; dy++) {
                if (isTreeCenter(cx, cy - dy)) { occupied = true; break; }
            }
            occupiedCache.set(key, occupied);
            if (occupiedCache.size > TREE_CACHE_LIMIT) {
                let i = 0; const del = Math.floor(TREE_CACHE_LIMIT / 4);
                for (const k of occupiedCache.keys()) { occupiedCache.delete(k); if (++i >= del) break; }
            }
            return occupied;
        }

        // 判断该格是否为自然生成的树枝
        function checkIsBranch(cx, cy) {
            for (let dx = -3; dx <= 3; dx++) {
                for (let dy = -3; dy <= 3; dy++) {
                    if (dx * dx + dy * dy <= 9) { // 3格半径内
                        const tx = cx + dx, ty = cy + dy;
                        if (isTreeCenter(tx, ty)) {
                            // 这棵树有1/4概率产生树枝
                            if (hash(tx, ty, 201) < 0.25) {
                                // 在这个树枝周围散落的具体位置判定
                                if (hash(cx, cy, 202) < 0.15) {
                                    return true;
                                }
                            }
                        }
                    }
                }
            }
            return false;
        }

        // ======================= 八、库存与物品 =======================
        function updateHotbarOrder(type, oldCount, newCount) {
            if (oldCount === 0 && newCount > 0) {
                if (!hotbarOrder.includes(type)) hotbarOrder.push(type);
            }
        }

        // UI绘制缩放系数：统一处理干草、绳子、碎石、树枝，让它们在 UI 里看起来小一点
        function getItemScale(type) {
            if (type === 'grass' || type === 'pebble') return 1.0;
            return 0.75; // 以后加的所有物品（特殊除外）都默认乘这个系数
        }

        function getActiveItems() {
            hotbarOrder = hotbarOrder.filter(t => inventory[t] > 0);
            const items = [];
            for (let type of hotbarOrder) {
                let img = type === 'grass' ? grassImg : type === 'pebble' ? pebbleImg : type === 'hay' ? hayImg : type === 'rope' ? ropeImg : type === 'gravel' ? gravelImg : branchImg;
                items.push({ type, img, count: inventory[type] });
            }
            return items;
        }

        function checkInventoryClick(logicX, logicY) {
            const activeItems = getActiveItems();
            if (activeItems.length === 0) return false;
            const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
            const startX = (logicWidth - totalWidth) / 2;
            const startY = logicHeight - uiItemSize - uiBottomMargin;

            if (logicX >= startX - 10 && logicX <= startX + totalWidth + 10 &&
                logicY >= startY - 10 && logicY <= startY + uiItemSize + 10) {
                for (let i = 0; i < activeItems.length; i++) {
                    const itemX = startX + i * (uiItemSize + uiGap);
                    if (logicX >= itemX && logicX <= itemX + uiItemSize && logicY >= startY && logicY <= startY + uiItemSize) {
                        selectedItemIndex = i; 
                        return true;
                    }
                }
            }
            return false;
        }

        window.addEventListener('wheel', (e) => {
            const activeItems = getActiveItems();
            if (activeItems.length <= 1) return;
            if (e.deltaY < 0) selectedItemIndex = (selectedItemIndex - 1 + activeItems.length) % activeItems.length;
            else selectedItemIndex = (selectedItemIndex + 1) % activeItems.length;
        }, { passive: true });

        function tryPlace(targetWorldX, targetWorldY) {
            const activeItems = getActiveItems();
            if (activeItems.length === 0) return;
            const selectedType = activeItems[selectedItemIndex].type;

            // 【新增】不可放置判定
            if (unplaceableItems.includes(selectedType)) return;

            const cx = Math.floor(targetWorldX / bgW);
            const cy = Math.floor(targetWorldY / bgH);
            const pointX = cx * bgW + bgW / 2;
            const pointY = cy * bgH + bgH / 2;
            const key = `${pointX},${pointY}`;

            const itemRand = hash(cx, cy, 1);
            let hasNatural = false;
            if (itemRand < grassChance) { if (!collectedGrassSet.has(key)) hasNatural = true; }
            else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) { if (!collectedPebbleSet.has(key)) hasNatural = true; }
            else if (!collectedBranchSet.has(key) && checkIsBranch(cx, cy)) { hasNatural = true; }

            if (hasNatural || placedItems.has(key) || isTreeCenter(cx, cy)) return;

            placedItems.set(key, selectedType);
            if (inventory[selectedType] > 0) inventory[selectedType]--;
        }

        function tryCollect(logicX, logicY) {
            const camX = Math.round(playerX - logicWidth / 2), camY = Math.round(playerY - logicHeight / 2);
            const clickWorldX = logicX + camX, clickWorldY = logicY + camY;
            const startCellX = Math.floor((camX - itemTargetSize) / bgW) - 1;
            const endCellX = Math.floor((camX + logicWidth + itemTargetSize) / bgW) + 1;
            const startCellY = Math.floor((camY - itemTargetSize) / bgH) - 1;
            const endCellY = Math.floor((camY + logicHeight + itemTargetSize) / bgH) + 1;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    const worldX = cx * bgW + bgW / 2, worldY = cy * bgH + bgH / 2;
                    const key = `${worldX},${worldY}`;
                    const hitW = itemTargetSize + 5, hitH = itemTargetSize + 5;

                    if (clickWorldX > worldX - hitW / 2 && clickWorldX < worldX + hitW / 2 &&
                        clickWorldY > worldY - hitH / 2 && clickWorldY < worldY + hitH / 2) {
                        
                        if (placedItems.has(key)) {
                            const type = placedItems.get(key);
                            placedItems.delete(key);
                            if (inventory[type] !== undefined) {
                                const old = inventory[type];
                                inventory[type]++;
                                updateHotbarOrder(type, old, inventory[type]);
                            }
                            return true;
                        }

                        const itemRand = hash(cx, cy, 1);
                        if (itemRand < grassChance) {
                            if (!collectedGrassSet.has(key)) { 
                                collectedGrassSet.add(key); 
                                const old = inventory.grass;
                                inventory.grass++; 
                                updateHotbarOrder('grass', old, inventory.grass);
                                return true; 
                            }
                        } else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) {
                            if (!collectedPebbleSet.has(key)) { 
                                collectedPebbleSet.add(key); 
                                const old = inventory.pebble;
                                inventory.pebble++; 
                                updateHotbarOrder('pebble', old, inventory.pebble);
                                return true; 
                            }
                        } else if (!collectedBranchSet.has(key) && checkIsBranch(cx, cy)) {
                            collectedBranchSet.add(key);
                            const old = inventory.branch;
                            inventory.branch++;
                            updateHotbarOrder('branch', old, inventory.branch);
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // ======================= 九、合成系统逻辑 =======================

        function getCraftRect() {
            const cx = logicWidth - craftSize - craftMargin;
            const cy = logicHeight / 2 - craftSize / 2;
            return { x: cx, y: cy, w: craftSize, h: craftSize };
        }

        function getSelectedItemScreenPos() {
            const activeItems = getActiveItems();
            if (activeItems.length === 0) return { x: logicWidth / 2, y: logicHeight };
            const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
            const startX = (logicWidth - totalWidth) / 2;
            return {
                x: startX + selectedItemIndex * (uiItemSize + uiGap) + uiItemSize / 2,
                y: logicHeight - uiItemSize - uiBottomMargin + uiItemSize / 2
            };
        }

        function handleCraftClick(x, y) {
            const rect = getCraftRect();
            const isInside = x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;

            if (craftState === 'result') {
                if (isInside) {
                    craftState = 'collecting';
                    craftAnimTimer = 0;
                    
                    let targetIndex = hotbarOrder.indexOf(craftResult.type);
                    let tempOrder = [...hotbarOrder];
                    if (targetIndex === -1) {
                        tempOrder.push(craftResult.type);
                        targetIndex = tempOrder.length - 1;
                    }
                    const activeCount = tempOrder.length;
                    const totalWidth = activeCount * uiItemSize + (activeCount - 1) * uiGap;
                    const startX = (logicWidth - totalWidth) / 2;
                    
                    craftResult.startX = rect.x + rect.w / 2;
                    craftResult.startY = rect.y + rect.h / 2;
                    craftResult.targetX = startX + targetIndex * (uiItemSize + uiGap) + uiItemSize / 2;
                    craftResult.targetY = logicHeight - uiItemSize - uiBottomMargin + uiItemSize / 2;
                    return true;
                }
                return false;
            }

            if (craftState === 'idle') {
                for (let i = 0; i < 4; i++) {
                    const slot = craftSlots[i];
                    if (!slot) continue;
                    if (Math.abs(x - slot.visX) < 15 && Math.abs(y - slot.visY) < 15) {
                        craftSlots[i] = null;
                        const old = inventory[slot.type];
                        inventory[slot.type]++;
                        updateHotbarOrder(slot.type, old, inventory[slot.type]);
                        
                        let targetIndex = hotbarOrder.indexOf(slot.type);
                        let tempOrder = [...hotbarOrder];
                        if (targetIndex === -1) {
                            tempOrder.push(slot.type);
                            targetIndex = tempOrder.length - 1;
                        }
                        const activeCount = tempOrder.length;
                        const totalWidth = activeCount * uiItemSize + (activeCount - 1) * uiGap;
                        const startX = (logicWidth - totalWidth) / 2;

                        returningItems.push({
                            type: slot.type,
                            img: slot.img,
                            startX: slot.visX,
                            startY: slot.visY,
                            targetX: startX + targetIndex * (uiItemSize + uiGap) + uiItemSize / 2,
                            targetY: logicHeight - uiItemSize - uiBottomMargin + uiItemSize / 2,
                            timer: 0
                        });
                        return true;
                    }
                }

                if (isInside) {
                    const localX = x - rect.x, localY = y - rect.y;
                    const isEdge = localX < 25 || localX > rect.w - 25 || localY < 25 || localY > rect.h - 25;
                    
                    if (isEdge) {
                        const now = performance.now();
                        if (now - lastEdgeClickTime < 350) {
                            attemptCraft();
                            lastEdgeClickTime = 0;
                            return true;
                        }
                        lastEdgeClickTime = now;
                    }

                    const halfW = rect.w / 2, halfH = rect.h / 2;
                    if (x < rect.x + halfW && y < rect.y + halfH) return tryPutInSlot(0);
                    if (x >= rect.x + halfW && y < rect.y + halfH) return tryPutInSlot(1);
                    if (x < rect.x + halfW && y >= rect.y + halfH) return tryPutInSlot(2);
                    if (x >= rect.x + halfW && y >= rect.y + halfH) return tryPutInSlot(3);
                    return true;
                }
            }
            return false;
        }

        function tryPutInSlot(index) {
            if (craftSlots[index] !== null) return true;
            const activeItems = getActiveItems();
            if (activeItems.length === 0) return true;
            
            const item = activeItems[selectedItemIndex];
            inventory[item.type]--;
            
            if (inventory[item.type] === 0 && selectedItemIndex >= getActiveItems().length) {
                selectedItemIndex = Math.max(0, getActiveItems().length - 1);
            }

            const startPos = getSelectedItemScreenPos();

            craftSlots[index] = {
                type: item.type,
                img: item.img,
                visX: startPos.x,
                visY: startPos.y,
                scale: 1
            };
            return true;
        }

        function attemptCraft() {
            let count = 0;
            const types = craftSlots.map(s => s ? s.type : null);
            for (let i = 0; i < 4; i++) if (types[i]) count++;
            if (count === 0) return;

            // 4个草 -> 4个干草
            if (count === 4 && types[0] === 'grass' && types[1] === 'grass' && types[2] === 'grass' && types[3] === 'grass') {
                craftResult = { type: 'hay', count: 4, img: hayImg };
                startCraftingAnim();
                return;
            }

            // 左上、右上、左下是干草 -> 1个绳子
            if (types[0] === 'hay' && types[1] === 'hay' && types[2] === 'hay' && types[3] === null) {
                craftResult = { type: 'rope', count: 1, img: ropeImg };
                startCraftingAnim();
                return;
            }
            
            // 任意两个石头 -> 2个砂砾
            if (count === 2 && types.filter(t => t === 'pebble').length === 2) {
                craftResult = { type: 'gravel', count: 2, img: gravelImg };
                startCraftingAnim();
                return;
            }

            craftState = 'shaking';
            craftAnimTimer = 0;
        }

        function startCraftingAnim() {
            craftState = 'crafting';
            craftAnimTimer = 0;
        }

        function updateCraft() {
            const rect = getCraftRect();

            for (let i = returningItems.length - 1; i >= 0; i--) {
                const item = returningItems[i];
                item.timer += FIXED_DT;
                const t = Math.min(item.timer / 300, 1);
                const easeT = 1 - Math.pow(1 - t, 2);
                item.currentX = item.startX + (item.targetX - item.startX) * easeT;
                item.currentY = item.startY + (item.targetY - item.startY) * easeT;
                if (t >= 1) returningItems.splice(i, 1);
            }

            for (let i = 0; i < 4; i++) {
                const slot = craftSlots[i];
                if (!slot || craftState === 'crafting') continue;

                let targetX = rect.x + craftSize * 0.25;
                let targetY = rect.y + craftSize * 0.25;
                if (i === 1) targetX = rect.x + craftSize * 0.75;
                if (i === 2) targetY = rect.y + craftSize * 0.75;
                if (i === 3) { targetX = rect.x + craftSize * 0.75; targetY = rect.y + craftSize * 0.75; }

                slot.visX += (targetX - slot.visX) * 0.2;
                slot.visY += (targetY - slot.visY) * 0.2;
                slot.scale += (1 - slot.scale) * 0.2;
            }

            if (craftState === 'shaking') {
                craftAnimTimer += FIXED_DT;
                if (craftAnimTimer < 400) {
                    craftShakeOffset.x = (Math.random() - 0.5) * 10;
                    craftShakeOffset.y = (Math.random() - 0.5) * 10;
                } else {
                    craftState = 'idle';
                    craftShakeOffset = { x: 0, y: 0 };
                }
            } 
            else if (craftState === 'crafting') {
                craftAnimTimer += FIXED_DT;
                const t = Math.min(craftAnimTimer / 350, 1);
                const centerX = rect.x + rect.w / 2;
                const centerY = rect.y + rect.h / 2;
                
                for (let i = 0; i < 4; i++) {
                    const slot = craftSlots[i];
                    if (!slot) continue;
                    slot.visX += (centerX - slot.visX) * 0.3;
                    slot.visY += (centerY - slot.visY) * 0.3;
                    slot.scale = 1 - t; 
                }

                if (craftAnimTimer >= 350) {
                    craftSlots = [null, null, null, null];
                    craftState = 'result';
                    craftAnimTimer = 0;
                    craftResult.scale = 0.1; 
                }
            } 
            else if (craftState === 'result') {
                if (craftResult.scale < 1) {
                    craftResult.scale += 0.15;
                    if (craftResult.scale > 1) craftResult.scale = 1;
                }
            } 
            else if (craftState === 'collecting') {
                craftAnimTimer += FIXED_DT;
                if (craftAnimTimer > 300) {
                    const old = inventory[craftResult.type];
                    inventory[craftResult.type] += craftResult.count;
                    updateHotbarOrder(craftResult.type, old, inventory[craftResult.type]);
                    craftResult = null;
                    craftState = 'idle';
                }
            }
        }

        // ======================= 十、碰撞检测 =======================
        function isBlocked(x, y) {
            const footX = x, footY = y + playerH / 2;
            const boxW = playerW * 0.5, boxH = playerH * 0.35;
            const left = footX - boxW / 2, right = footX + boxW / 2;
            const top = footY - boxH, bottom = footY;
            const minCX = Math.floor(left / bgW), maxCX = Math.floor(right / bgW);
            const minCY = Math.floor(top / bgH), maxCY = Math.floor(bottom / bgH);
            const inset = bgW * 0.15;

            for (let cx = minCX; cx <= maxCX; cx++) {
                for (let cy = minCY; cy <= maxCY; cy++) {
                    if (!isTreeCenter(cx, cy)) continue;
                    const tL = cx * bgW + inset, tR = (cx + 1) * bgW - inset;
                    const tT = cy * bgH + inset, tB = (cy + 1) * bgH - inset;
                    if (right > tL && left < tR && bottom > tT && top < tB) return true;
                }
            }
            return false;
        }

        // ======================= 十一、输入事件 =======================
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const { x, y } = getLogicCoords(e.clientX, e.clientY);
            if (handleCraftClick(x, y)) return;
            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);
            tryPlace(x + camX, y + camY);
        });

        canvas.addEventListener('mousedown', (e) => { 
            if (e.button === 0) {
                isTouchMode = false;
                const { x, y } = getLogicCoords(e.clientX, e.clientY);
                if (handleCraftClick(x, y)) return;

                const btnX = logicWidth - placeBtnSize - placeBtnMargin;
                const btnY = logicHeight - placeBtnSize - placeBtnMargin;
                if (x >= btnX && x <= btnX + placeBtnSize && y >= btnY && y <= btnY + placeBtnSize) {
                    isPlaceButtonPressed = true; tryPlace(playerX, playerY); return;
                }
                if (checkInventoryClick(x, y)) return;
                if (tryCollect(x, y)) return;
            }
        });
        
        window.addEventListener('mouseup', (e) => { if (e.button === 0) { isPlaceButtonPressed = false; } });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouchMode = true;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const { x, y } = getLogicCoords(touch.clientX, touch.clientY);
                if (handleCraftClick(x, y)) continue;

                const baseCenterX = joystickBaseMargin + joystickBaseSize / 2;
                const baseCenterY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                if (Math.hypot(x - baseCenterX, y - baseCenterY) < joystickBaseSize) {
                    joystickActive = true; joystickTouchId = touch.identifier;
                    joystickCurrentX = x; joystickCurrentY = y;
                    continue;
                }

                const btnX = logicWidth - placeBtnSize - placeBtnMargin;
                const btnY = logicHeight - placeBtnSize - placeBtnMargin;
                if (x >= btnX && x <= btnX + placeBtnSize && y >= btnY && y <= btnY + placeBtnSize) {
                    isPlaceButtonPressed = true; tryPlace(playerX, playerY); continue;
                }
                if (checkInventoryClick(x, y)) continue;
                if (tryCollect(x, y)) continue;
            }
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const { x, y } = getLogicCoords(touch.clientX, touch.clientY);
                if (joystickActive && touch.identifier === joystickTouchId) {
                    const baseCenterX = joystickBaseMargin + joystickBaseSize / 2;
                    const baseCenterY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                    let dx = x - baseCenterX, dy = y - baseCenterY;
                    const dist = Math.hypot(dx, dy), maxDist = joystickBaseSize / 2; 
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystickCurrentX = baseCenterX + dx; joystickCurrentY = baseCenterY + dy;
                }
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    joystickActive = false; joystickTouchId = null;
                    joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
                    joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                }
            }
            isPlaceButtonPressed = false; 
        }, { passive: false });
        
        window.addEventListener('touchcancel', () => { 
            joystickActive = false; joystickTouchId = null;
            joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
            joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
            isPlaceButtonPressed = false; 
        });

        // ======================= 十二、逻辑更新 =======================
        function update() {
            let targetVx = 0, targetVy = 0, isMoving = false;
            let kdx = 0, kdy = 0;
            if (keys.w || keys.arrowup) kdy -= 1;
            if (keys.s || keys.arrowdown) kdy += 1;
            if (keys.a || keys.arrowleft) kdx -= 1;
            if (keys.d || keys.arrowright) kdx += 1;

            if (kdx !== 0 || kdy !== 0) {
                isMoving = true; const length = Math.hypot(kdx, kdy);
                targetVx = (kdx / length) * maxSpeed; targetVy = (kdy / length) * maxSpeed;
            } else if (joystickActive) {
                isMoving = true; const bX = joystickBaseMargin + joystickBaseSize / 2;
                const bY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                const dx = joystickCurrentX - bX, dy = joystickCurrentY - bY;
                const dist = Math.hypot(dx, dy), maxDist = joystickBaseSize / 2;
                const force = Math.min(dist / maxDist, 1);
                if (dist > 5) { targetVx = (dx / dist) * maxSpeed * force; targetVy = (dy / dist) * maxSpeed * force; }
            }

            if (isMoving) {
                velocityX += (targetVx - velocityX) * accelerationSmooth;
                velocityY += (targetVy - velocityY) * accelerationSmooth;
            } else {
                velocityX *= friction; velocityY *= friction;
                if (Math.abs(velocityX) < 0.05) velocityX = 0;
                if (Math.abs(velocityY) < 0.05) velocityY = 0;
            }

            const stuck = isBlocked(playerX, playerY);
            if (stuck) {
                playerX += velocityX; playerY += velocityY;
            } else {
                const nextX = playerX + velocityX;
                const nextY = playerY + velocityY;
                if (!isBlocked(nextX, playerY)) playerX = nextX; else velocityX = 0;
                if (!isBlocked(playerX, nextY)) playerY = nextY; else velocityY = 0;
            }

            const activeItems = getActiveItems();
            if (selectedItemIndex >= activeItems.length) selectedItemIndex = Math.max(0, activeItems.length - 1);

            if (activeItems.length > 0) {
                const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
                const startX = (logicWidth - totalWidth) / 2;
                const targetX = startX + selectedItemIndex * (uiItemSize + uiGap);
                if (electorVisualX === null) electorVisualX = targetX;
                else {
                    electorVisualX += (targetX - electorVisualX) * electorSlideSpeed;
                    if (Math.abs(targetX - electorVisualX) < 0.1) electorVisualX = targetX;
                }
            }

            updateCraft();
        }

        // ======================= 十三、渲染 =======================
        let renderList = [];

        function draw() {
            ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = '#3b7a3b'; ctx.fillRect(0, 0, logicWidth, logicHeight);

            if (!isGameStarted) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                const pct = Math.round(imagesLoaded / totalImages * 100);
                ctx.fillText(`Loading... ${pct}%`, logicWidth / 2, logicHeight / 2 - 20);
                const barW = Math.min(320, logicWidth * 0.6), barH = 14;
                const barX = (logicWidth - barW) / 2, barY = logicHeight / 2 + 10;
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = '#4CAF50'; ctx.fillRect(barX, barY, barW * (imagesLoaded / totalImages), barH);
                return;
            }

            const camX = Math.round(playerX - logicWidth / 2), camY = Math.round(playerY - logicHeight / 2);

            // 1) 画背景
            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                const startX = Math.floor(camX / bgW) * bgW, startY = Math.floor(camY / bgH) * bgH;
                for (let x = startX; x <= camX + logicWidth; x += bgW) {
                    for (let y = startY; y <= camY + logicHeight; y += bgH) {
                        ctx.drawImage(bgImg, x - camX, y - camY, bgW, bgH);
                    }
                }
            }

            // 2) 收集对象
            renderList = [];
            const startCellX = Math.floor(camX / bgW) - 5, endCellX = Math.floor((camX + logicWidth) / bgW) + 5;
            const startCellY = Math.floor(camY / bgH) - 12, endCellY = Math.floor((camY + logicHeight) / bgH) + 12;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    const treeInfo = getTreeInfo(cx, cy);
                    if (treeInfo.isCenter) {
                        renderList.push({ kind: 'tree', y: cy * bgH + bgH, cx, cy, trunkHeight: treeInfo.trunkHeight, topY: cy - treeInfo.trunkHeight, worldX: cx * bgW + bgW / 2 });
                    }
                    
                    const worldX = cx * bgW + bgW / 2, worldY = cy * bgH + bgH / 2;
                    const key = `${worldX},${worldY}`;
                    const isPlaced = placedItems.has(key);
                    const isOccupied = isTreeOccupied(cx, cy);

                    if (isPlaced) {
                        const t = placedItems.get(key);
                        let imgToDraw = t === 'grass' ? grassImg : t === 'pebble' ? pebbleImg : t === 'hay' ? hayImg : t === 'rope' ? ropeImg : t === 'gravel' ? gravelImg : t === 'branch' ? branchImg : null;
                        if (imgToDraw) renderList.push({ kind: 'item', y: worldY, x: worldX, img: imgToDraw, size: itemTargetSize });
                    } else if (!isOccupied) {
                        const itemRand = hash(cx, cy, 1);
                        let imgToDraw = null;
                        if (itemRand < grassChance) {
                            if (!collectedGrassSet.has(key)) imgToDraw = grassImg;
                        } else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) {
                            if (!collectedPebbleSet.has(key)) imgToDraw = pebbleImg;
                        } else if (!collectedBranchSet.has(key) && checkIsBranch(cx, cy)) {
                            imgToDraw = branchImg;
                        }
                        if (imgToDraw) renderList.push({ kind: 'item', y: worldY, x: worldX, img: imgToDraw, size: itemTargetSize });
                    }
                }
            }

            let currentPlayerImg = playerImg; 
            const speed = Math.hypot(velocityX, velocityY);
            if (speed > 0.2) {
                if (Math.abs(velocityY) > Math.abs(velocityX)) currentPlayerImg = velocityY > 0 ? playerDownImg : playerUpImg;
                else currentPlayerImg = velocityX > 0 ? playerRightImg : playerLeftImg;
            }
            if (!currentPlayerImg || !currentPlayerImg.complete || currentPlayerImg.naturalHeight === 0) currentPlayerImg = playerImg;
            
            renderList.push({ kind: 'player', y: playerY + playerH / 2, x: playerX, img: currentPlayerImg, size: playerW });

            renderList.sort((a, b) => a.y - b.y);

            for (let item of renderList) {
                if (item.kind === 'player') {
                    const pX = Math.round(logicWidth / 2 - playerW / 2), pY = Math.round(logicHeight / 2 - playerH / 2);
                    if (item.img.complete && item.img.naturalHeight !== 0) ctx.drawImage(item.img, pX, pY, playerW, playerH);
                    else { ctx.fillStyle = '#3498db'; ctx.fillRect(pX, pY, playerW, playerH); ctx.fillStyle = '#000'; ctx.fillRect(pX + 10, pY + 10, 6, 10); ctx.fillRect(pX + 32, pY + 10, 6, 10); }
                } else if (item.kind === 'tree') {
                    const { cx, cy, trunkHeight, topY, worldX } = item;
                    ctx.drawImage(treeStumpImg, worldX - bgW / 2 - camX, cy * bgH + bgH / 2 - bgW / 2 - camY, bgW, bgW);
                    for (let i = 1; i <= trunkHeight; i++) ctx.drawImage(treeTrunkImg, worldX - bgW / 2 - camX, (cy - i) * bgH + bgH / 2 - bgW / 2 - camY, bgW, bgW);
                    const leafS = bgW * leafSizeMultiplier;
                    for (let dx = -2; dx <= 2; dx++) ctx.drawImage(leafImg, (cx + dx) * bgW + bgW / 2 - leafS / 2 - camX, (topY - 1) * bgH + bgH / 2 - leafS / 2 - camY, leafS, leafS);
                    for (let dx = -2; dx <= 2; dx++) ctx.drawImage(leafImg, (cx + dx) * bgW + bgW / 2 - leafS / 2 - camX, (topY - 2) * bgH + bgH / 2 - leafS / 2 - camY, leafS, leafS);
                    for (let dx = -1; dx <= 1; dx++) ctx.drawImage(leafImg, (cx + dx) * bgW + bgW / 2 - leafS / 2 - camX, (topY - 3) * bgH + bgH / 2 - leafS / 2 - camY, leafS, leafS);
                } else {
                    if (item.img.complete && item.img.naturalHeight !== 0) ctx.drawImage(item.img, item.x - item.size / 2 - camX, item.y - item.size / 2 - camY, item.size, item.size);
                }
            }

            // ================== 绘制合成系统 ==================
            const rect = getCraftRect();
            
            ctx.save();
            ctx.translate(craftShakeOffset.x, craftShakeOffset.y);

            if (craftImg.complete && craftImg.naturalHeight !== 0) {
                ctx.drawImage(craftImg, rect.x, rect.y, rect.w, rect.h);
            } else {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
            }

            for (let i = 0; i < 4; i++) {
                const slot = craftSlots[i];
                if (!slot) continue;
                const drawSize = craftSlotSize * slot.scale * getItemScale(slot.type);
                if (drawSize > 0) {
                    ctx.drawImage(slot.img, slot.visX - drawSize / 2, slot.visY - drawSize / 2, drawSize, drawSize);
                }
            }

            for (const item of returningItems) {
                if (item.currentX !== undefined) {
                    const t = Math.min(item.timer / 300, 1);
                    const size = craftSlotSize * (1 - t * 0.5) * getItemScale(item.type);
                    ctx.drawImage(item.img, item.currentX - size / 2, item.currentY - size / 2, size, size);
                }
            }

            if (craftState === 'result' || craftState === 'collecting') {
                let drawX = rect.x + rect.w / 2;
                let drawY = rect.y + rect.h / 2;
                let drawScale = craftResult.scale;

                if (craftState === 'collecting') {
                    const t = Math.min(craftAnimTimer / 300, 1);
                    const easeT = 1 - Math.pow(1 - t, 2);
                    drawX = craftResult.startX + (craftResult.targetX - craftResult.startX) * easeT;
                    drawY = craftResult.startY + (craftResult.targetY - craftResult.startY) * easeT;
                    drawScale = 1 - t * 0.5;
                }

                const size = craftSlotSize * 1.2 * drawScale * getItemScale(craftResult.type); 
                if (size > 0) {
                    ctx.drawImage(craftResult.img, drawX - size / 2, drawY - size / 2, size, size);
                }
                
                if (craftState === 'result') {
                    const str = craftResult.count.toString();
                    let rx = drawX + size / 2 - 2;
                    for (let j = str.length - 1; j >= 0; j--) {
                        const d = digitImgs[str[j]];
                        if (d && d.complete) {
                            const w = d.width * 1.6, h = d.height * 1.6;
                            ctx.drawImage(d, rx - w, drawY - size / 2 + 2, w, h);
                            rx -= (w + 1);
                        }
                    }
                }
            }
            ctx.restore();

            // ================== UI 绘制（物品栏等） ==================
            const activeItems = getActiveItems();
            if (activeItems.length > 0) {
                const idx = Math.min(selectedItemIndex, activeItems.length - 1);
                const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
                const startX = (logicWidth - totalWidth) / 2, startY = logicHeight - uiItemSize - uiBottomMargin;
                const targetX = startX + idx * (uiItemSize + uiGap);
                if (electorVisualX === null) electorVisualX = targetX;

                for (let i = 0; i < activeItems.length; i++) {
                    const item = activeItems[i], itemX = startX + i * (uiItemSize + uiGap), itemY = startY;
                    
                    const drawSize = uiItemSize * getItemScale(item.type);
                    const offset = (uiItemSize - drawSize) / 2;
                    
                    if (item.img.complete && item.img.naturalHeight !== 0) {
                        ctx.drawImage(item.img, itemX + offset, itemY + offset, drawSize, drawSize);
                    }

                    const str = item.count.toString(); let currentRightX = itemX + uiItemSize - 2;
                    const digitScale = 1.5 * UI_SCALE; 
                    for (let j = str.length - 1; j >= 0; j--) {
                        const d = digitImgs[str[j]];
                        if (d && d.complete && d.naturalHeight !== 0) {
                            const w = d.width * digitScale, h = d.height * digitScale;
                            ctx.drawImage(d, currentRightX - w, itemY + 2, w, h);
                            currentRightX -= (w + 1);
                        }
                    }
                }
                if (electorImg.complete && electorImg.naturalHeight !== 0) {
                    ctx.drawImage(electorImg, Math.round(electorVisualX) - 2, startY - 2, uiItemSize + 4, uiItemSize + 4);
                }
            }

            // 摇杆和按钮
            if (isTouchMode) {
                const btnX = logicWidth - placeBtnSize - placeBtnMargin, btnY = logicHeight - placeBtnSize - placeBtnMargin;
                const cPI = (isPlaceButtonPressed && pressedPlaceImg.complete) ? pressedPlaceImg : placeImg;
                if (cPI.complete && cPI.naturalHeight !== 0) ctx.drawImage(cPI, btnX, btnY, placeBtnSize, placeBtnSize);

                const bCX = joystickBaseMargin + joystickBaseSize / 2, bCY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                if (joystickBaseImg.complete && joystickBaseImg.naturalHeight !== 0) {
                    ctx.globalAlpha = 0.6; ctx.drawImage(joystickBaseImg, bCX - joystickBaseSize/2, bCY - joystickBaseSize/2, joystickBaseSize, joystickBaseSize); ctx.globalAlpha = 1.0;
                }
                if (joystickControlImg.complete && joystickControlImg.naturalHeight !== 0) {
                    ctx.drawImage(joystickControlImg, joystickCurrentX - joystickControlSize/2, joystickCurrentY - joystickControlSize/2, joystickControlSize, joystickControlSize);
                }
            }

            if (errors.length > 0) {
                const boxW = Math.max(300, logicWidth * 0.4);
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(10, 10, boxW, 30 + errors.length * 20);
                ctx.fillStyle = '#ff4c4c'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
                ctx.fillText('缺失的图片:', 15, 30);
                for (let i = 0; i < errors.length; i++) ctx.fillText('- ' + errors[i], 15, 50 + i * 20);
            }
        }

        // ======================= 十四、主循环 =======================
        let lastFrameTime = 0, accumulator = 0;
        function gameLoop(now) {
            let frameTime = now - lastFrameTime;
            if (frameTime > MAX_FRAME_TIME) frameTime = MAX_FRAME_TIME;
            lastFrameTime = now;
            accumulator += frameTime;

            while (accumulator >= FIXED_DT) {
                update();
                accumulator -= FIXED_DT;
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
