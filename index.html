<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha 1.0 - Debug Mode</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #3b7a3b; user-select: none;
        }
        canvas {
            display: block; image-rendering: pixelated; image-rendering: crisp-edges;
            touch-action: none; cursor: grab; position: absolute; top: 0; left: 0; outline: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" tabindex="0"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const bgTargetSize = 80, playerTargetSize = 48, itemTargetSize = 64;
        const grassChance = 0.025, pebbleChance = 0.025;
        const maxSpeed = 5.5, maxRadius = 250, accelerationSmooth = 0.15, friction = 0.94;
        const uiItemSize = 38, uiGap = 9, uiBottomMargin = 12, placeBtnSize = 38, placeBtnMargin = 18;
        const electorSlideSpeed = 0.2, joystickBaseSize = 128, joystickBaseMargin = 30, joystickControlSize = 64;

        const collectedGrassSet = new Set(), collectedPebbleSet = new Set(), placedItems = new Map();
        const inventory = { grass: 0, pebble: 0 };
        let selectedItemIndex = 0, isPlaceButtonPressed = false, electorVisualX = null;
        let isTouchMode = true, joystickActive = false, joystickTouchId = null;
        let joystickCurrentX = 0, joystickCurrentY = 0;

        // 资源加载
        const bgImg = new Image(), playerImg = new Image(), playerRightImg = new Image();
        const playerLeftImg = new Image(), playerUpImg = new Image(), playerDownImg = new Image();
        const grassImg = new Image(), pebbleImg = new Image(), electorImg = new Image();
        const placeImg = new Image(), pressedPlaceImg = new Image();
        const joystickBaseImg = new Image(), joystickControlImg = new Image();
        
        // 如果路径错了，这里会 404
        bgImg.src = './Game/picture/item/grass_land.png';
        playerImg.src = './Game/picture/mob/player.png';
        playerRightImg.src = './Game/picture/mob/player_right.png';
        playerLeftImg.src = './Game/picture/mob/player_left.png';
        playerUpImg.src = './Game/picture/mob/player_up.png';
        playerDownImg.src = './Game/picture/mob/player_down.png';
        grassImg.src = './Game/picture/item/grass.png';
        pebbleImg.src = './Game/picture/item/pebble.png';
        electorImg.src = './Game/picture/ui/hotbar_elector.png';
        placeImg.src = './Game/picture/ui/place.png'; 
        pressedPlaceImg.src = './Game/picture/ui/pressed_place.png';
        joystickBaseImg.src = './Game/picture/ui/joystick.png';
        joystickControlImg.src = './Game/picture/ui/control_stick.png';

        const digitImgs = {};
        for (let i = 0; i <= 9; i++) {
            digitImgs[i] = new Image();
            digitImgs[i].src = `./Game/picture/text/${i}.png`;
        }

        let bgW = bgTargetSize, bgH = bgTargetSize, playerW = playerTargetSize, playerH = playerTargetSize;
        let logicWidth = window.innerWidth, logicHeight = window.innerHeight;
        let isPortraitForced = false, isGameStarted = false;
        let playerX = 0, playerY = 0, velocityX = 0, velocityY = 0;
        
        let errors = []; // 收集报错的图片路径

        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowleft: false, arrowdown: false, arrowright: false };
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
                if (key.startsWith('arrow')) e.preventDefault();
                isTouchMode = false; 
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        const allImages = [
            bgImg, playerImg, playerRightImg, playerLeftImg, playerUpImg, playerDownImg,
            grassImg, pebbleImg, electorImg, placeImg, pressedPlaceImg, joystickBaseImg, joystickControlImg
        ];
        for (let i = 0; i <= 9; i++) allImages.push(digitImgs[i]);

        let imagesLoaded = 0;
        const totalImages = allImages.length;

        function checkLoaded() {
            imagesLoaded++;
            if (imagesLoaded >= totalImages) startGame();
        }

        function startGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            if (bgImg.complete && bgImg.naturalHeight !== 0) { bgW = bgTargetSize; bgH = bgTargetSize * (bgImg.height / bgImg.width); }
            if (playerImg.complete && playerImg.naturalHeight !== 0) { playerW = playerTargetSize; playerH = playerTargetSize * (playerImg.height / playerImg.width); }
            initScreen(); 
            gameLoop();
        }
        
        allImages.forEach(img => {
            img.onload = checkLoaded;
            img.onerror = function() {
                errors.push(this.src.split('/').pop()); // 记录失败的图片名字
                checkLoaded(); 
            };
            if (img.complete) checkLoaded();
        });

        setTimeout(startGame, 3000);
        initScreen();

        function initScreen() {
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth, h = window.innerHeight;
            if (h > w) {
                isPortraitForced = true; logicWidth = h; logicHeight = w;
                canvas.width = logicWidth * dpr; canvas.height = logicHeight * dpr;
                canvas.style.width = logicWidth + "px"; canvas.style.height = logicHeight + "px";
                canvas.style.transformOrigin = "top left";
                canvas.style.transform = `translateX(${w}px) rotate(90deg)`;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            } else {
                isPortraitForced = false; logicWidth = w; logicHeight = h;
                canvas.width = logicWidth * dpr; canvas.height = logicHeight * dpr;
                canvas.style.width = logicWidth + "px"; canvas.style.height = logicHeight + "px";
                canvas.style.transform = "none";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
            joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
        }

        function getLogicCoords(clientX, clientY) {
            if (isPortraitForced) return { x: clientY, y: window.innerWidth - clientX };
            return { x: clientX, y: clientY };
        }

        function hash(x, y, seed = 0) {
            let n = x * 374761393 + y * 668265263 + seed * 144665;
            n = (n ^ (n >> 13)) * 1274126177;
            return ((n ^ (n >> 16)) >>> 0) / 4294967296;
        }

        function update() {
            let targetVx = 0, targetVy = 0, isMoving = false;
            let kdx = 0, kdy = 0;
            if (keys.w || keys.arrowup) kdy -= 1;
            if (keys.s || keys.arrowdown) kdy += 1;
            if (keys.a || keys.arrowleft) kdx -= 1;
            if (keys.d || keys.arrowright) kdx += 1;

            if (kdx !== 0 || kdy !== 0) {
                isMoving = true; const length = Math.hypot(kdx, kdy);
                targetVx = (kdx / length) * maxSpeed; targetVy = (kdy / length) * maxSpeed;
            } else if (joystickActive) {
                isMoving = true; const bX = joystickBaseMargin + joystickBaseSize / 2;
                const bY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                const dx = joystickCurrentX - bX, dy = joystickCurrentY - bY;
                const dist = Math.hypot(dx, dy), maxDist = joystickBaseSize / 2;
                const force = Math.min(dist / maxDist, 1);
                if (dist > 5) { targetVx = (dx / dist) * maxSpeed * force; targetVy = (dy / dist) * maxSpeed * force; }
            }
            if (isMoving) {
                velocityX += (targetVx - velocityX) * accelerationSmooth;
                velocityY += (targetVy - velocityY) * accelerationSmooth;
            } else {
                velocityX *= friction; velocityY *= friction;
                if (Math.abs(velocityX) < 0.05) velocityX = 0;
                if (Math.abs(velocityY) < 0.05) velocityY = 0;
            }
            playerX += velocityX; playerY += velocityY;
        }

        function draw() {
            ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = '#3b7a3b'; ctx.fillRect(0, 0, logicWidth, logicHeight);

            if (!isGameStarted) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center'; ctx.fillText('Loading...', logicWidth/2, logicHeight/2);
                return;
            }

            const camX = Math.round(playerX - logicWidth / 2), camY = Math.round(playerY - logicHeight / 2);

            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                const startX = Math.floor(camX / bgW) * bgW, startY = Math.floor(camY / bgH) * bgH;
                for (let x = startX; x <= camX + logicWidth; x += bgW) {
                    for (let y = startY; y <= camY + logicHeight; y += bgH) {
                        ctx.drawImage(bgImg, x - camX, y - camY, bgW, bgH);
                    }
                }
            }

            const startCellX = Math.floor(camX / bgW) - 1, endCellX = Math.floor((camX + logicWidth) / bgW) + 1;
            const startCellY = Math.floor(camY / bgH) - 1, endCellY = Math.floor((camY + logicHeight) / bgH) + 1;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    const worldX = cx * bgW + bgW / 2, worldY = cy * bgH + bgH / 2;
                    const itemRand = hash(cx, cy, 1), screenX = worldX - camX, screenY = worldY - camY;
                    const key = `${worldX},${worldY}`;

                    if (placedItems.has(key)) {
                        const type = placedItems.get(key), img = type === 'grass' ? grassImg : pebbleImg;
                        if (img.complete && img.naturalHeight !== 0) ctx.drawImage(img, screenX - itemTargetSize / 2, screenY - itemTargetSize / 2, itemTargetSize, itemTargetSize);
                    } else if (itemRand < grassChance) {
                        if (!collectedGrassSet.has(key) && grassImg.complete && grassImg.naturalHeight !== 0) {
                            ctx.drawImage(grassImg, screenX - itemTargetSize / 2, screenY - itemTargetSize / 2, itemTargetSize, itemTargetSize);
                        }
                    } else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) {
                        if (!collectedPebbleSet.has(key) && pebbleImg.complete && pebbleImg.naturalHeight !== 0) {
                            ctx.drawImage(pebbleImg, screenX - itemTargetSize / 2, screenY - itemTargetSize / 2, itemTargetSize, itemTargetSize);
                        }
                    }
                }
            }

            const pX = Math.round(logicWidth / 2 - playerW / 2), pY = Math.round(logicHeight / 2 - playerH / 2);
            if (playerImg.complete && playerImg.naturalHeight !== 0) {
                let cImg = playerImg; const speed = Math.hypot(velocityX, velocityY);
                if (speed > 0.2) {
                    if (Math.abs(velocityY) > Math.abs(velocityX)) cImg = velocityY > 0 ? playerDownImg : playerUpImg;
                    else cImg = velocityX > 0 ? playerRightImg : playerLeftImg;
                }
                if (!cImg || !cImg.complete || cImg.naturalHeight === 0) cImg = playerImg;
                ctx.drawImage(cImg, pX, pY, playerW, playerH);
            } else {
                ctx.fillStyle = '#3498db'; ctx.fillRect(pX, pY, playerW, playerH);
                ctx.fillStyle = '#000'; ctx.fillRect(pX + 10, pY + 10, 6, 10); ctx.fillRect(pX + 32, pY + 10, 6, 10);
            }

            // 绘制摇杆和放置按钮 (仅限触摸模式)
            if (isTouchMode) {
                const btnX = logicWidth - placeBtnSize - placeBtnMargin, btnY = logicHeight - placeBtnSize - placeBtnMargin;
                const cPI = (isPlaceButtonPressed && pressedPlaceImg.complete) ? pressedPlaceImg : placeImg;
                if (cPI.complete && cPI.naturalHeight !== 0) ctx.drawImage(cPI, btnX, btnY, placeBtnSize, placeBtnSize);

                const bCX = joystickBaseMargin + joystickBaseSize / 2, bCY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                if (joystickBaseImg.complete && joystickBaseImg.naturalHeight !== 0) {
                    ctx.globalAlpha = 0.6; ctx.drawImage(joystickBaseImg, bCX - joystickBaseSize/2, bCY - joystickBaseSize/2, joystickBaseSize, joystickBaseSize); ctx.globalAlpha = 1.0;
                }
                if (joystickControlImg.complete && joystickControlImg.naturalHeight !== 0) {
                    ctx.drawImage(joystickControlImg, joystickCurrentX - joystickControlSize/2, joystickCurrentY - joystickControlSize/2, joystickControlSize, joystickControlSize);
                }
            }

            // 🌟 核心：如果发现了错误，在屏幕左上角打印出来！
            if (errors.length > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(10, 10, 300, 30 + errors.length * 20);
                ctx.fillStyle = '#ff4c4c'; 
                ctx.font = 'bold 14px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('❌ 缺失或路径错误的图片:', 15, 30);
                for (let i = 0; i < errors.length; i++) {
                    ctx.fillText('- ' + errors[i], 15, 50 + i * 20);
                }
            }
        }

        // 加上鼠标和触摸事件（为了篇幅省略，和你上一版一样）
        canvas.addEventListener('mousedown', (e) => { 
            if (e.button === 0) {
                const { x, y } = getLogicCoords(e.clientX, e.clientY);
                // ... 简单收集逻辑 ...
            }
        });
        // ... 其他事件 ...

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    </script>
</body>
</html>
