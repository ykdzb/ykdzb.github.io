<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>正五边形 · 尺规作图演示</title>
<style>
  :root{
    --cyan:#4dd0e1;
    --gold:#ffd54f;
    --orange:#ffa726;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:#000;
    color:#e6eef7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .app{
    display:grid;
    grid-template-columns: minmax(300px, 620px) 340px;
    gap:28px;
    align-items:center;
    width:100%;
    max-width:1050px;
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:20px;
    overflow:hidden;
    background: radial-gradient(circle at 50% 50%, #08111a 0%, #000 72%);
    box-shadow:
      0 0 0 1px rgba(77,208,225,.16),
      0 0 90px rgba(77,208,225,.07) inset,
      0 24px 60px rgba(0,0,0,.8);
  }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .panel{
    background: linear-gradient(180deg, rgba(18,28,38,.92), rgba(6,10,16,.92));
    border:1px solid rgba(77,208,225,.18);
    border-radius:20px;
    padding:26px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
  }
  .panel h1{
    font-size:20px; margin:0 0 14px; letter-spacing:.06em;
    background: linear-gradient(90deg,#4dd0e1,#ffd54f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .badge{
    display:inline-block;
    font-size:12px; letter-spacing:.12em;
    color:#4dd0e1;
    border:1px solid rgba(77,208,225,.35);
    border-radius:999px;
    padding:3px 12px;
    margin-bottom:14px;
  }
  h2{ font-size:16px; margin:0 0 10px; color:#fff; font-weight:600; }
  .desc{
    font-size:14px; line-height:1.85; color:#9fb3c4;
    min-height:78px; margin:0;
  }

  .dots{ display:flex; gap:6px; margin:20px 0 4px; }
  .dots span{
    flex:1; height:3px; border-radius:2px;
    background:rgba(255,255,255,.11);
    transition: background .35s;
  }
  .dots span.on{ background: linear-gradient(90deg,#4dd0e1,#ffd54f); }

  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
  button{
    padding:10px 14px; border-radius:11px; cursor:pointer;
    background: rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    color:#dfe9f3; font-size:14px; font-family:inherit;
    transition:.2s;
  }
  button:hover:not(:disabled){
    background: rgba(77,208,225,.16);
    border-color: rgba(77,208,225,.55);
  }
  button:disabled{ opacity:.28; cursor:not-allowed; }
  button.primary{
    background: linear-gradient(135deg,#0e7c86,#1b6070);
    border-color: rgba(77,208,225,.6);
    color:#eafcff;
  }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    .stage{ max-width:520px; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage"><canvas id="cv"></canvas></div>

  <aside class="panel">
    <h1>正五边形 · 尺规作图</h1>
    <div class="badge">第 <span id="stepNo">1</span> / 8 步</div>
    <h2 id="stepTitle"></h2>
    <p class="desc" id="stepDesc"></p>
    <div class="dots" id="dots"></div>
    <div class="btns">
      <button id="prev">上一步</button>
      <button id="next">下一步</button>
      <button id="auto" class="primary">自动演示</button>
      <button id="reset">重置</button>
    </div>
  </aside>
</div>

<script>
/* ============================================================
   基本环境
   ============================================================ */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W = 0, H = 0, cx = 0, cy = 0, scale = 1;

/* 颜色 */
const CYAN   = '#4dd0e1';   // 主圆
const GRAY   = '#5b7186';   // 直径 / 辅助直线
const ORANGE = '#ffa726';   // 尺规圆弧
const WHITE  = '#eceff1';   // 点与标注
const GOLD   = '#ffd54f';   // 最终五边形

/* ============================================================
   几何对象（世界坐标，圆半径 R = 1）
   ============================================================ */
const O = { x: 0,  y: 0  };
const A = { x: 1,  y: 0  };   // 水平直径右端
const B = { x: -1, y: 0  };   // 水平直径左端
const C = { x: 0,  y: 1  };   // 竖直直径上端
const D = { x: 0,  y: -1 };   // 竖直直径下端

const M = { x: 0.5, y: 0 };                    // OA 中点
const PHI = (Math.sqrt(5) - 1) / 2;            // 0.618…
const N = { x: -PHI, y: 0 };                   // 由 M 截得

const polar = (deg, r = 1) => {
  const a = deg * Math.PI / 180;
  return { x: r * Math.cos(a), y: r * Math.sin(a) };
};
/* 正五边形的五个顶点（C 在正上方，间隔 72°） */
const V0 = polar(90);    // = C
const V1 = polar(18);    // P
const V2 = polar(-54);   // R
const V3 = polar(-126);  // S
const V4 = polar(162);   // Q

const CN = Math.hypot(C.x - N.x, C.y - N.y);   // ≈ 1.1756 = 2sin36°
const MC = Math.hypot(C.x - M.x, C.y - M.y);   // ≈ 1.1180 = √5/2

/* ============================================================
   坐标变换与绘制工具
   ============================================================ */
const S = p => ({ x: cx + p.x * scale, y: cy - p.y * scale });

function strokeLine(a, b, color, width, t, glow = false) {
  if (t <= 0) return;
  const p1 = S(a), p2 = S(b);
  const ex = p1.x + (p2.x - p1.x) * t;
  const ey = p1.y + (p2.y - p1.y) * t;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.restore();
}

function strokeArc(c, r, a0, a1, color, width, t, glow = false) {
  if (t <= 0) return;
  const A0 = a0;
  const A1 = a0 + (a1 - a0) * t;
  const n = Math.max(2, Math.ceil(Math.abs(A1 - A0) / 1.5));
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (A0 + (A1 - A0) * i / n) * Math.PI / 180;
    const p = S({ x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.restore();
}

function dot(p, color, t, radius = 3.4) {
  if (t <= 0) return;
  const q = S(p);
  ctx.save();
  ctx.globalAlpha = Math.min(1, t * 1.6);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(q.x, q.y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function tag(p, text, color, t, dx = 12, dy = -12) {
  if (t <= 0) return;
  const q = S(p);
  ctx.save();
  ctx.globalAlpha = Math.min(1, t * 1.6);
  ctx.fillStyle = color;
  ctx.font = '600 15px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, q.x + dx, q.y + dy);
  ctx.restore();
}

/* ============================================================
   八个作图步骤
   ============================================================ */
const steps = [
  /* 1 ------------------------------------------------------ */
  {
    title: '① 作圆',
    desc: '以点 O 为圆心，取任意长为半径 R 作圆 ⊙O。',
    draw(t) {
      strokeArc(O, 1, 0, 360, CYAN, 1.8, t);
      dot(O, WHITE, t, 3.2);
      tag(O, 'O', WHITE, t, -14, 16);
    }
  },

  /* 2 ------------------------------------------------------ */
  {
    title: '② 作两条互相垂直的直径',
    desc: '过圆心 O 作两条互相垂直的直径 AB 与 CD。',
    draw(t) {
      strokeLine(A, B, GRAY, 1.3, t);
      strokeLine(C, D, GRAY, 1.3, t);
      dot(A, WHITE, t, 3); dot(B, WHITE, t, 3);
      dot(C, WHITE, t, 3); dot(D, WHITE, t, 3);
      tag(A, 'A', WHITE, t, 16, 14);
      tag(B, 'B', WHITE, t, -16, 14);
      tag(C, 'C', WHITE, t, -16, -10);
      tag(D, 'D', WHITE, t, 16, -10);
    }
  },

  /* 3 ------------------------------------------------------ */
  {
    title: '③ 作 OA 的中点 M',
    desc: '分别以 O、A 为圆心，取大于 OA 一半的同一长度为半径作弧，两弧交于上下两点；连结这两点，与 OA 的交点 M 即为 OA 的中点。',
    draw(t) {
      const r  = 0.62;
      const y0 = Math.sqrt(r * r - 0.25);       // ≈0.3666
      const t1 = Math.min(1, t / 0.62);         // 两段弧
      const t2 = Math.max(0, (t - 0.62) / 0.38); // 中垂线

      strokeArc(O, r, -50, 50, ORANGE, 1.2, t1);
      strokeArc(A, r, 130, 230, ORANGE, 1.2, t1);

      if (t2 > 0) {
        strokeLine({ x: 0.5, y: y0 }, { x: 0.5, y: -y0 }, GRAY, 1.2, t2);
        dot(M, WHITE, t2, 3.4);
        tag(M, 'M', WHITE, t2, -4, 20);
      }
    }
  },

  /* 4 ------------------------------------------------------ */
  {
    title: '④ 截取点 N',
    desc: '以 M 为圆心、MC 为半径作弧，交半径 OB 于点 N。此时 ON = (√5−1)/2 · R ≈ 0.618R。',
    draw(t) {
      strokeArc(M, MC, 105, 186, ORANGE, 1.2, t);
      dot(N, WHITE, t, 3.4);
      tag(N, 'N', WHITE, t, -2, 22);
    }
  },

  /* 5 ------------------------------------------------------ */
  {
    title: '⑤ 得到正五边形边长 CN',
    desc: '连结 C、N，则线段 CN 的长度恰好等于圆内接正五边形的边长 s = 2R·sin36° ≈ 1.176R。',
    draw(t) {
      strokeLine(C, N, GOLD, 2.2, t, true);
    }
  },

  /* 6 ------------------------------------------------------ */
  {
    title: '⑥ 在圆上截取 P、Q',
    desc: '以 C 为圆心、CN 为半径作弧，交圆 ⊙O 于 P、Q 两点 —— 它们是 C 的两个相邻顶点。',
    draw(t) {
      strokeArc(C, CN, -28, -152, ORANGE, 1.2, t);
      if (t > 0.72) {
        const t2 = (t - 0.72) / 0.28;
        dot(V1, WHITE, t2, 3.4);
        dot(V4, WHITE, t2, 3.4);
        tag(V1, 'P', WHITE, t2, 16, 2);
        tag(V4, 'Q', WHITE, t2, -16, 2);
      }
    }
  },

  /* 7 ------------------------------------------------------ */
  {
    title: '⑦ 截取剩下的两个顶点',
    desc: '分别以 P、Q 为圆心，仍以 CN 为半径作弧，交圆 ⊙O 于 R、S 两点。至此圆上已有五个等分点。',
    draw(t) {
      const t1 = Math.min(1, t / 0.72);
      strokeArc(V1, CN, 140, 256, ORANGE, 1.2, t1);
      strokeArc(V4, CN, 40, -76, ORANGE, 1.2, t1);
      if (t > 0.72) {
        const t2 = (t - 0.72) / 0.28;
        dot(V2, WHITE, t2, 3.4);
        dot(V3, WHITE, t2, 3.4);
        tag(V2, 'R', WHITE, t2, 16, 10);
        tag(V3, 'S', WHITE, t2, -16, 10);
      }
    }
  },

  /* 8 ------------------------------------------------------ */
  {
    title: '⑧ 连线成五边形',
    desc: '依次连结 C、P、R、S、Q 各点，即得圆内接正五边形 CPRSQ —— 五条边相等，五个内角均为 108°。',
    draw(t) {
      const order = [V0, V1, V2, V3, V4, V0];
      const segs = 5;

      ctx.save();
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = 2.6;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255,213,79,.9)';
      ctx.shadowBlur = 16;

      const p0 = S(order[0]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      let rest = t * segs;
      for (let i = 0; i < segs && rest > 0; i++) {
        const f = Math.min(1, rest);
        const a = S(order[i]), b = S(order[i + 1]);
        ctx.lineTo(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f);
        rest -= 1;
      }
      ctx.stroke();
      ctx.restore();

      /* 顶点高亮 */
      if (t > 0.85) {
        const t2 = (t - 0.85) / 0.15;
        [V0, V1, V2, V3, V4].forEach(p => dot(p, GOLD, t2, 3.6));
      }
    }
  }
];

/* ============================================================
   状态与动画
   ============================================================ */
let cur = 0;            // 当前步骤索引
let prog = 0;           // 当前步骤动画进度 0~1
let lastTs = 0;
let autoOn = false;
let autoWait = 0;

const DURATION = 0.7;   // 单步动画时长（秒）

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i <= cur; i++) {
    const t = (i === cur) ? prog : 1;
    if (t <= 0) continue;
    steps[i].draw(t);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.064, (ts - lastTs) / 1000);
  lastTs = ts;

  if (prog < 1) prog = Math.min(1, prog + dt / DURATION);

  if (autoOn && prog >= 1) {
    autoWait -= dt;
    if (autoWait <= 0) {
      if (cur < steps.length - 1) {
        cur++; prog = 0; autoWait = 0.55;
        updateUI();
      } else {
        autoOn = false;
        updateUI();
      }
    }
  }

  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   UI
   ============================================================ */
const elNo    = document.getElementById('stepNo');
const elTitle = document.getElementById('stepTitle');
const elDesc  = document.getElementById('stepDesc');
const elDots  = document.getElementById('dots');
const btnPrev = document.getElementById('prev');
const btnNext = document.getElementById('next');
const btnAuto = document.getElementById('auto');
const btnReset= document.getElementById('reset');

/* 进度条 */
steps.forEach(() => elDots.appendChild(document.createElement('span')));
const dots = [...elDots.children];

function updateUI() {
  elNo.textContent    = cur + 1;
  elTitle.textContent = steps[cur].title;
  elDesc.textContent  = steps[cur].desc;
  dots.forEach((d, i) => d.classList.toggle('on', i <= cur));
  btnPrev.disabled = cur <= 0;
  btnNext.disabled = cur >= steps.length - 1;
  btnAuto.textContent = autoOn ? '暂停演示' : '自动演示';
}

btnPrev.onclick = () => {
  if (cur > 0) { cur--; prog = 0; autoOn = false; updateUI(); }
};
btnNext.onclick = () => {
  if (cur < steps.length - 1) { cur++; prog = 0; autoOn = false; updateUI(); }
};
btnAuto.onclick = () => {
  autoOn = !autoOn;
  autoWait = 0.35;
  if (autoOn && cur >= steps.length - 1 && prog >= 1) {
    cur = 0; prog = 0;        // 已到末尾则从头播放
  }
  updateUI();
};
btnReset.onclick = () => {
  cur = 0; prog = 0; autoOn = false; autoWait = 0;
  updateUI();
};

/* ============================================================
   尺寸自适应
   ============================================================ */
function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  W = rect.width;
  H = rect.height;

  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cx = W / 2;
  cy = H / 2;
  scale = Math.min(W, H) * 0.34;   // 单位长度 R 对应的像素

  draw();
}

window.addEventListener('resize', resize);

/* 启动 */
resize();
updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
