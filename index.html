<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha 1.0</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #3b7a3b; /* 纯绿背景兜底 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none; 
            cursor: grab;
            position: absolute;
            top: 0;
            left: 0;
            outline: none;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" tabindex="0"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ================= 核心配置区 =================
        const bgTargetSize = 80;        
        const playerTargetSize = 48;    
        const itemTargetSize = 64;      

        const grassChance = 0.025;       
        const pebbleChance = 0.025;      

        const maxSpeed = 5.5;          
        const maxRadius = 250;         
        const accelerationSmooth = 0.15; 
        const friction = 0.94;           
        
        // UI 配置
        const uiItemSize = 38;          
        const uiGap = 9;                
        const uiBottomMargin = 12;      
        
        const placeBtnSize = 38;        
        const placeBtnMargin = 18;      

        const electorSlideSpeed = 0.2;

        // 摇杆配置
        const joystickBaseSize = 128;   
        const joystickBaseMargin = 30;  
        const joystickControlSize = 64; 
        // ==========================================

        const collectedGrassSet = new Set();
        const collectedPebbleSet = new Set();
        const placedItems = new Map();
        
        const inventory = {
            grass: 0,
            pebble: 0
        };

        let selectedItemIndex = 0;
        let isPlaceButtonPressed = false;
        let electorVisualX = null;

        // 双端模式状态
        let isTouchMode = true; 
        
        // 摇杆状态
        let joystickActive = false;
        let joystickTouchId = null;
        let joystickCurrentX = 0;
        let joystickCurrentY = 0;

        // 资源加载
        const bgImg = new Image();
        const playerImg = new Image(); 
        const playerRightImg = new Image();
        const playerLeftImg = new Image();
        const playerUpImg = new Image();
        const playerDownImg = new Image();
        
        const grassImg = new Image();
        const pebbleImg = new Image();
        const electorImg = new Image(); 
        const placeImg = new Image(); 
        const pressedPlaceImg = new Image(); 
        const joystickBaseImg = new Image(); 
        const joystickControlImg = new Image(); 
        
        bgImg.src = './Game/picture/item/grass_land.png';
        
        playerImg.src = './Game/picture/mob/player.png';
        playerRightImg.src = './Game/picture/mob/player_right.png';
        playerLeftImg.src = './Game/picture/mob/player_left.png';
        playerUpImg.src = './Game/picture/mob/player_up.png';
        playerDownImg.src = './Game/picture/mob/player_down.png';

        grassImg.src = './Game/picture/item/grass.png';
        pebbleImg.src = './Game/picture/item/pebble.png';
        electorImg.src = './Game/picture/ui/hotbar_elector.png';
        placeImg.src = './Game/picture/ui/place.png'; 
        pressedPlaceImg.src = './Game/picture/ui/pressed_place.png';
        joystickBaseImg.src = './Game/picture/ui/joystick.png';
        joystickControlImg.src = './Game/picture/ui/control_stick.png';

        const digitImgs = {};
        for (let i = 0; i <= 9; i++) {
            digitImgs[i] = new Image();
            digitImgs[i].src = `./Game/picture/text/${i}.png`;
        }

        let bgW = bgTargetSize, bgH = bgTargetSize;
        let playerW = playerTargetSize, playerH = playerTargetSize;

        let logicWidth = window.innerWidth;
        let logicHeight = window.innerHeight;
        let isPortraitForced = false;
        
        let isGameStarted = false;

        let playerX = 0;
        let playerY = 0;
        let velocityX = 0;
        let velocityY = 0;

        const keys = {
            w: false, a: false, s: false, d: false,
            arrowup: false, arrowleft: false, arrowdown: false, arrowright: false
        };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
                if(key.startsWith('arrow')) e.preventDefault();
                isTouchMode = false; 
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = false;
            }
        });

        // 🌟 汇总所有图片到数组，方便统一管理加载
        const allImages = [
            bgImg, playerImg, playerRightImg, playerLeftImg, playerUpImg, playerDownImg,
            grassImg, pebbleImg, electorImg, placeImg, pressedPlaceImg, joystickBaseImg, joystickControlImg
        ];
        // 把 0-9 的数字图片也加进去
        for (let i = 0; i <= 9; i++) {
            allImages.push(digitImgs[i]);
        }

        let imagesLoaded = 0;
        const totalImages = allImages.length; // 动态获取总图片数 (13 + 10 = 23)

        function checkLoaded() {
            imagesLoaded++;
            // 当所有图片（或失败状态）都返回时，开始游戏
            if (imagesLoaded >= totalImages) {
                if (bgImg.complete && bgImg.naturalHeight !== 0) {
                    bgW = bgTargetSize; bgH = bgTargetSize * (bgImg.height / bgImg.width);
                }
                if (playerImg.complete && playerImg.naturalHeight !== 0) {
                    playerW = playerTargetSize; playerH = playerTargetSize * (playerImg.height / playerImg.width);
                }
                startGame();
            }
        }

        function startGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            
            initScreen(); 
            gameLoop();
        }
        
        allImages.forEach(img => {
            img.onload = checkLoaded;
            img.onerror = checkLoaded; 
            // 如果图片已经从缓存中加载过了，直接手动触发
            if (img.complete) {
                checkLoaded();
            }
        });

        // 保险：如果 4 秒后还没加载完（比如网络差），强制启动
        setTimeout(startGame, 4000);

        // 提前初始化屏幕，确保 Loading 界面也是铺满的绿
        initScreen();

        function initScreen() {
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;

            if (h > w) {
                isPortraitForced = true;
                logicWidth = h;
                logicHeight = w;

                canvas.width = logicWidth * dpr;
                canvas.height = logicHeight * dpr;
                
                canvas.style.width = logicWidth + "px";
                canvas.style.height = logicHeight + "px";
                canvas.style.transformOrigin = "top left";
                canvas.style.transform = `translateX(${w}px) rotate(90deg)`;
                
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            } else {
                isPortraitForced = false;
                logicWidth = w;
                logicHeight = h;

                canvas.width = logicWidth * dpr;
                canvas.height = logicHeight * dpr;
                
                canvas.style.width = logicWidth + "px";
                canvas.style.height = logicHeight + "px";
                canvas.style.transform = "none";
                
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            
            joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
            joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
        }

        function getLogicCoords(clientX, clientY) {
            if (isPortraitForced) {
                return {
                    x: clientY,
                    y: window.innerWidth - clientX
                };
            } else {
                return { x: clientX, y: clientY };
            }
        }

        function hash(x, y, seed = 0) {
            let n = x * 374761393 + y * 668265263 + seed * 144665;
            n = (n ^ (n >> 13)) * 1274126177;
            return ((n ^ (n >> 16)) >>> 0) / 4294967296;
        }

        function getActiveItems() {
            const items = [];
            if (inventory.grass > 0) items.push({ type: 'grass', img: grassImg, count: inventory.grass });
            if (inventory.pebble > 0) items.push({ type: 'pebble', img: pebbleImg, count: inventory.pebble });
            return items;
        }

        function checkInventoryClick(logicX, logicY) {
            const activeItems = getActiveItems();
            if (activeItems.length === 0) return false;

            const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
            const startX = (logicWidth - totalWidth) / 2;
            const startY = logicHeight - uiItemSize - uiBottomMargin;

            if (logicX >= startX - 10 && logicX <= startX + totalWidth + 10 && 
                logicY >= startY - 10 && logicY <= startY + uiItemSize + 10) {
                
                for (let i = 0; i < activeItems.length; i++) {
                    const itemX = startX + i * (uiItemSize + uiGap);
                    const itemY = startY;
                    if (logicX >= itemX && logicX <= itemX + uiItemSize &&
                        logicY >= itemY && logicY <= itemY + uiItemSize) {
                        
                        selectedItemIndex = i; 
                        return true; 
                    }
                }
            }
            return false;
        }

        window.addEventListener('wheel', (e) => {
            const activeItems = getActiveItems();
            if (activeItems.length <= 1) return;

            if (e.deltaY < 0) {
                selectedItemIndex = (selectedItemIndex - 1 + activeItems.length) % activeItems.length;
            } else {
                selectedItemIndex = (selectedItemIndex + 1) % activeItems.length;
            }
        }, { passive: true });

        function tryPlace(targetWorldX, targetWorldY) {
            const activeItems = getActiveItems();
            if (activeItems.length === 0) return; 
            
            const selectedType = activeItems[selectedItemIndex].type;

            const cx = Math.floor(targetWorldX / bgW);
            const cy = Math.floor(targetWorldY / bgH);
            const pointX = cx * bgW + bgW / 2;
            const pointY = cy * bgH + bgH / 2;
            const key = `${pointX},${pointY}`;

            const itemRand = hash(cx, cy, 1);
            let hasNatural = false;
            if (itemRand < grassChance) {
                if (!collectedGrassSet.has(key)) hasNatural = true;
            } else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) {
                if (!collectedPebbleSet.has(key)) hasNatural = true;
            }

            if (hasNatural || placedItems.has(key)) return;

            placedItems.set(key, selectedType);
            if (selectedType === 'grass') inventory.grass--;
            if (selectedType === 'pebble') inventory.pebble--;
        }

        function tryCollect(logicX, logicY) {
            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);
            
            const clickWorldX = logicX + camX;
            const clickWorldY = logicY + camY;

            const startCellX = Math.floor((camX - itemTargetSize) / bgW) - 1;
            const endCellX = Math.floor((camX + logicWidth + itemTargetSize) / bgW) + 1;
            const startCellY = Math.floor((camY - itemTargetSize) / bgH) - 1;
            const endCellY = Math.floor((camY + logicHeight + itemTargetSize) / bgH) + 1;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    
                    const worldX = cx * bgW + bgW / 2;
                    const worldY = cy * bgH + bgH / 2;
                    const key = `${worldX},${worldY}`;
                    
                    const hitW = itemTargetSize + 5;
                    const hitH = itemTargetSize + 5;
                    
                    if (clickWorldX > worldX - hitW / 2 && clickWorldX < worldX + hitW / 2 &&
                        clickWorldY > worldY - hitH / 2 && clickWorldY < worldY + hitH / 2) {
                        
                        if (placedItems.has(key)) {
                            const type = placedItems.get(key);
                            placedItems.delete(key);
                            if (type === 'grass') inventory.grass++;
                            if (type === 'pebble') inventory.pebble++;
                            return true;
                        }

                        const itemRand = hash(cx, cy, 1); 
                        if (itemRand < grassChance) {
                            if (!collectedGrassSet.has(key)) {
                                collectedGrassSet.add(key);
                                inventory.grass++;
                                return true; 
                            }
                        } 
                        else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) {
                            if (!collectedPebbleSet.has(key)) {
                                collectedPebbleSet.add(key);
                                inventory.pebble++;
                                return true; 
                            }
                        }
                    }
                }
            }
            return false;
        }

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
            const { x, y } = getLogicCoords(e.clientX, e.clientY);
            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);
            tryPlace(x + camX, y + camY);
        });

        canvas.addEventListener('mousedown', (e) => { 
            if (e.button === 0) {
                const { x, y } = getLogicCoords(e.clientX, e.clientY);
                
                if (tryCollect(x, y)) return;
                isMouseDown = true; 
                mouseX = x; 
                mouseY = y; 
            }
        });
        
        window.addEventListener('mousemove', (e) => { 
            if (isMouseDown) { 
                const { x, y } = getLogicCoords(e.clientX, e.clientY);
                mouseX = x; 
                mouseY = y; 
            } 
        });
        
        window.addEventListener('mouseup', (e) => { 
            if (e.button === 0) isMouseDown = false; 
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const { x, y } = getLogicCoords(touch.clientX, touch.clientY);
                
                const baseCenterX = joystickBaseMargin + joystickBaseSize / 2;
                const baseCenterY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;

                const distToBase = Math.hypot(x - baseCenterX, y - baseCenterY);
                if (distToBase < joystickBaseSize) {
                    joystickActive = true;
                    joystickTouchId = touch.identifier;
                    joystickCurrentX = x;
                    joystickCurrentY = y;
                    continue;
                }

                const btnX = logicWidth - placeBtnSize - placeBtnMargin;
                const btnY = logicHeight - placeBtnSize - placeBtnMargin;
                if (x >= btnX && x <= btnX + placeBtnSize && y >= btnY && y <= btnY + placeBtnSize) {
                    isPlaceButtonPressed = true; 
                    tryPlace(playerX, playerY);
                    continue;
                }

                if (checkInventoryClick(x, y)) continue;
                if (tryCollect(x, y)) continue;

                isMouseDown = true;
                mouseX = x;
                mouseY = y;
            }
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const { x, y } = getLogicCoords(touch.clientX, touch.clientY);

                if (joystickActive && touch.identifier === joystickTouchId) {
                    const baseCenterX = joystickBaseMargin + joystickBaseSize / 2;
                    const baseCenterY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                    
                    let dx = x - baseCenterX;
                    let dy = y - baseCenterY;
                    const dist = Math.hypot(dx, dy);
                    const maxDist = joystickBaseSize / 2; 

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    joystickCurrentX = baseCenterX + dx;
                    joystickCurrentY = baseCenterY + dy;
                } else if (isMouseDown) {
                    mouseX = x;
                    mouseY = y;
                }
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    joystickActive = false;
                    joystickTouchId = null;
                    joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
                    joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                }
            }
            isMouseDown = false; 
            isPlaceButtonPressed = false; 
        }, { passive: false });
        
        window.addEventListener('touchcancel', () => { 
            joystickActive = false;
            joystickTouchId = null;
            joystickCurrentX = joystickBaseMargin + joystickBaseSize / 2;
            joystickCurrentY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
            isMouseDown = false; 
            isPlaceButtonPressed = false; 
        });

        function update() {
            let targetVx = 0;
            let targetVy = 0;
            let isMoving = false;

            // 1. 键盘模式
            let kdx = 0, kdy = 0;
            if (keys.w || keys.arrowup) kdy -= 1;
            if (keys.s || keys.arrowdown) kdy += 1;
            if (keys.a || keys.arrowleft) kdx -= 1;
            if (keys.d || keys.arrowright) kdx += 1;

            if (kdx !== 0 || kdy !== 0) {
                isMoving = true;
                const length = Math.hypot(kdx, kdy);
                targetVx = (kdx / length) * maxSpeed;
                targetVy = (kdy / length) * maxSpeed;
            } 
            // 2. 摇杆模式
            else if (joystickActive) {
                isMoving = true;
                const baseCenterX = joystickBaseMargin + joystickBaseSize / 2;
                const baseCenterY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                
                const dx = joystickCurrentX - baseCenterX;
                const dy = joystickCurrentY - baseCenterY;
                const dist = Math.hypot(dx, dy);
                const maxDist = joystickBaseSize / 2;

                const force = Math.min(dist / maxDist, 1);
                
                if (dist > 5) {
                    targetVx = (dx / dist) * maxSpeed * force;
                    targetVy = (dy / dist) * maxSpeed * force;
                }
            }
            // 3. 鼠标拖拽模式
            else if (isMouseDown) {
                isMoving = true;
                const centerX = logicWidth / 2;
                const centerY = logicHeight / 2;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.hypot(dx, dy);

                if (distance > 10) { 
                    const effectiveDist = Math.min(distance, maxRadius);
                    const currentMaxSpeed = (effectiveDist / maxRadius) * maxSpeed;
                    targetVx = (dx / distance) * currentMaxSpeed;
                    targetVy = (dy / distance) * currentMaxSpeed;
                }
            }

            if (isMoving) {
                velocityX += (targetVx - velocityX) * accelerationSmooth;
                velocityY += (targetVy - velocityY) * accelerationSmooth;
            } else {
                velocityX *= friction;
                velocityY *= friction;
                if (Math.abs(velocityX) < 0.05) velocityX = 0;
                if (Math.abs(velocityY) < 0.05) velocityY = 0;
            }

            playerX += velocityX;
            playerY += velocityY;

            const activeItems = getActiveItems();
            if (selectedItemIndex >= activeItems.length) {
                selectedItemIndex = Math.max(0, activeItems.length - 1);
            }
        }

        function draw() {
            ctx.imageSmoothingEnabled = false;
            
            // 纯绿背景兜底
            ctx.fillStyle = '#3b7a3b'; 
            ctx.fillRect(0, 0, logicWidth, logicHeight);

            if (!isGameStarted) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Loading...', logicWidth/2, logicHeight/2);
                return; 
            }

            const camX = Math.round(playerX - logicWidth / 2);
            const camY = Math.round(playerY - logicHeight / 2);

            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                const startX = Math.floor(camX / bgW) * bgW;
                const startY = Math.floor(camY / bgH) * bgH;
                const endX = camX + logicWidth;
                const endY = camY + logicHeight;

                for (let x = startX; x <= endX; x += bgW) {
                    for (let y = startY; y <= endY; y += bgH) {
                        ctx.drawImage(bgImg, x - camX, y - camY, bgW, bgH);
                    }
                }
            }

            const startCellX = Math.floor(camX / bgW) - 1;
            const endCellX = Math.floor((camX + logicWidth) / bgW) + 1;
            const startCellY = Math.floor(camY / bgH) - 1;
            const endCellY = Math.floor((camY + logicHeight) / bgH) + 1;

            for (let cx = startCellX; cx <= endCellX; cx++) {
                for (let cy = startCellY; cy <= endCellY; cy++) {
                    
                    const worldX = cx * bgW + bgW / 2;
                    const worldY = cy * bgH + bgH / 2;
                    
                    const itemRand = hash(cx, cy, 1);
                    const screenX = worldX - camX;
                    const screenY = worldY - camY;
                    const key = `${worldX},${worldY}`;

                    if (placedItems.has(key)) {
                        const type = placedItems.get(key);
                        const img = type === 'grass' ? grassImg : pebbleImg;
                        if (img.complete && img.naturalHeight !== 0) {
                            ctx.drawImage(img, screenX - itemTargetSize / 2, screenY - itemTargetSize / 2, itemTargetSize, itemTargetSize);
                        }
                    } 
                    else if (itemRand < grassChance) {
                        if (!collectedGrassSet.has(key) && grassImg.complete && grassImg.naturalHeight !== 0) {
                            ctx.drawImage(grassImg, screenX - itemTargetSize / 2, screenY - itemTargetSize / 2, itemTargetSize, itemTargetSize);
                        }
                    } 
                    else if (itemRand >= grassChance && itemRand < grassChance + pebbleChance) {
                        if (!collectedPebbleSet.has(key) && pebbleImg.complete && pebbleImg.naturalHeight !== 0) {
                            ctx.drawImage(pebbleImg, screenX - itemTargetSize / 2, screenY - itemTargetSize / 2, itemTargetSize, itemTargetSize);
                        }
                    }
                }
            }

            const playerScreenX = Math.round(logicWidth / 2 - playerW / 2);
            const playerScreenY = Math.round(logicHeight / 2 - playerH / 2);
            
            if (playerImg.complete && playerImg.naturalHeight !== 0) {
                let currentPlayerImg = playerImg; 
                
                const speed = Math.hypot(velocityX, velocityY);
                
                if (speed > 0.2) {
                    if (Math.abs(velocityY) > Math.abs(velocityX)) {
                        currentPlayerImg = velocityY > 0 ? playerDownImg : playerUpImg;
                    } else {
                        currentPlayerImg = velocityX > 0 ? playerRightImg : playerLeftImg;
                    }
                }

                if (!currentPlayerImg || !currentPlayerImg.complete || currentPlayerImg.naturalHeight === 0) {
                    currentPlayerImg = playerImg;
                }

                ctx.drawImage(currentPlayerImg, playerScreenX, playerScreenY, playerW, playerH);
            } else {
                ctx.fillStyle = '#3498db'; 
                ctx.fillRect(playerScreenX, playerScreenY, playerW, playerH);
                ctx.fillStyle = '#000';
                ctx.fillRect(playerScreenX + 10, playerScreenY + 10, 6, 10);
                ctx.fillRect(playerScreenX + 32, playerScreenY + 10, 6, 10);
            }

            drawInventoryUI();

            if (isTouchMode) {
                const btnX = logicWidth - placeBtnSize - placeBtnMargin;
                const btnY = logicHeight - placeBtnSize - placeBtnMargin;
                
                const currentPlaceImg = (isPlaceButtonPressed && pressedPlaceImg.complete && pressedPlaceImg.naturalHeight !== 0) 
                                        ? pressedPlaceImg 
                                        : placeImg;

                if (currentPlaceImg.complete && currentPlaceImg.naturalHeight !== 0) {
                    ctx.drawImage(currentPlaceImg, btnX, btnY, placeBtnSize, placeBtnSize);
                }

                const baseCenterX = joystickBaseMargin + joystickBaseSize / 2;
                const baseCenterY = logicHeight - joystickBaseMargin - joystickBaseSize / 2;
                if (joystickBaseImg.complete && joystickBaseImg.naturalHeight !== 0) {
                    ctx.globalAlpha = 0.6;
                    ctx.drawImage(joystickBaseImg, baseCenterX - joystickBaseSize/2, baseCenterY - joystickBaseSize/2, joystickBaseSize, joystickBaseSize);
                    ctx.globalAlpha = 1.0;
                }

                if (joystickControlImg.complete && joystickControlImg.naturalHeight !== 0) {
                    ctx.drawImage(joystickControlImg, joystickCurrentX - joystickControlSize/2, joystickCurrentY - joystickControlSize/2, joystickControlSize, joystickControlSize);
                }
            }
        }

        function drawInventoryUI() {
            const activeItems = getActiveItems();
            if (activeItems.length === 0) {
                electorVisualX = null; 
                return;
            }

            const totalWidth = activeItems.length * uiItemSize + (activeItems.length - 1) * uiGap;
            const startX = (logicWidth - totalWidth) / 2;
            const startY = logicHeight - uiItemSize - uiBottomMargin;

            const targetX = startX + selectedItemIndex * (uiItemSize + uiGap);

            if (electorVisualX === null) {
                electorVisualX = targetX;
            } else {
                electorVisualX += (targetX - electorVisualX) * electorSlideSpeed;
                if (Math.abs(targetX - electorVisualX) < 0.1) {
                    electorVisualX = targetX;
                }
            }

            for (let i = 0; i < activeItems.length; i++) {
                const item = activeItems[i];
                const itemX = startX + i * (uiItemSize + uiGap);
                const itemY = startY;

                if (item.img.complete && item.img.naturalHeight !== 0) {
                    ctx.drawImage(item.img, itemX, itemY, uiItemSize, uiItemSize);
                }

                drawNumber(item.count, itemX + uiItemSize - 2, itemY + 2);
            }

            if (electorImg.complete && electorImg.naturalHeight !== 0) {
                const drawElectorX = Math.round(electorVisualX);
                ctx.drawImage(electorImg, drawElectorX - 2, startY - 2, uiItemSize + 4, uiItemSize + 4);
            }
        }

        function drawNumber(num, endX, endY) {
            const str = num.toString();
            let currentRightX = endX;
            const numScale = 1.5; 

            for (let i = str.length - 1; i >= 0; i--) {
                const digit = str[i];
                const img = digitImgs[digit];

                if (img && img.complete && img.naturalHeight !== 0) {
                    const w = img.width * numScale;
                    const h = img.height * numScale;
                    
                    ctx.drawImage(img, currentRightX - w, endY, w, h);

                    currentRightX -= (w + 1); 
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 20px "Courier New", Courier, monospace';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    ctx.fillText(str, endX, endY);
                    return; 
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
